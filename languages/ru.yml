  LABEL_HIRE_PERFECT_EMPLOYEE_DESCRIPTION: |
    Здравствуйте,

    Меня зовут [b]%s[/b]. На вашем портале вакансий я нашёл очень интересную должность, которая, как мне кажется, идеально мне подходит.
    Изучив описание вакансии и требования и сопоставив их со своим опытом, я уверен, что стану ценным сотрудником для вашей организации.

    Недавно я получил степень бакалавра в области компьютерной инженерии в Марсианском университете.
    Теперь я хочу применить свои навыки в такой компании, как [b]%s[/b].
    Как инженер, я умею применять инженерные концепции для создания инновационных и оригинальных продуктов для потребителей.

    Я был бы рад обсудить с вами эту прекрасную возможность подробнее. Буду очень признателен за ответ на мою заявку.

