  TOOLTIP_PLATFORM_MARKETING: |
    Eenmaal geactiveerd, start de marketingcampagne
    zodra de console wordt uitgebracht.
  TOOLTIP_MENU_CREATE_GAME: |
    Maak een nieuwe game, een game-engine, een contract,
    een spelrapport of een port
  TOOLTIP_MENU_CREATE_CONSOLE: |
