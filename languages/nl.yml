  TOOLTIP_UNIVERSITY_TRAINING_TYPE: |
    Train je werknemers tot ze perfect zijn of gedurende een vaste
    tijd.
  TOOLTIP_UNIVERSITY_AUTOTRAINING: |
    Stuurt werknemers automatisch naar training tot ze perfect zijn
    of tot er werk te doen is. Vereist Personeelszaken.
