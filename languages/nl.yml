  LABEL_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: Minimale tevredenheid
  TOOLTIP_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: |
    Stuurt automatisch een werknemer op vakantie wanneer hun tevredenheid onder de ingestelde limiet daalt.

    Wanneer een werknemer ontevreden is, werkt hij minder effectief en gaat vaker op vakantie.
    Om werknemers productiever te houden, is het beter om ze op vakantie te sturen voordat
    ze te ontevreden worden.
  TOOLTIP_STUDIO_DIRECTOR_SEQUEL: |
    Kies de vervolgstrategie van de directeur:

    • Geen vervolgen: richt zich uitsluitend op het maken van nieuwe games
    • Alleen eigen games: maakt vervolgen alleen voor games die ze hebben ontwikkeld
    • Alle games: maakt vervolgen voor de gehele beschikbare catalogus

    Zodra voltooid, hervat de directeur de ontwikkeling van nieuwe projecten.
