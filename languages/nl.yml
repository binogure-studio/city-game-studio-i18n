    maak een nieuwe console
  TOOLTIP_GAME_CREATION_BALANCING: |
    Toont de werklast die over je werknemers wordt verdeeld.
    Een te hoge of te lage werklast heeft invloed op de kwaliteit van
    de geproduceerde games.

    Om een uitstekende score te halen, moet de werklast binnen de witte zone blijven.
  TOOLTIP_GAME_UPDATE: |
    Het plaatsen van een gratis update zal de verkoop van een game stimuleren.
    Een betaalde update genereert inkomsten in verhouding tot het aantal
    verkochte exemplaren van de originele game.
