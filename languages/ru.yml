  LABEL_INTERVIEW_INDIE: |
    Привет,
    Я Бруно Триггер. Каждую среду я веду шоу [i]3615 Dorian[/i] о независимых видеоиграх. 
    Как большой поклонник [b]%s[/b], я хотел бы задать вам несколько вопросов для нашего большого игрового вечера [b]%s[/b].
    У вас есть 5 минут?
  LABEL_INTERVIEW_INDIE_QUESTION: |
    Я мечтаю отправиться в приключение по самостоятельной разработке игр! Быть собственным боссом и общаться с любящим и заботливым сообществом, какая мечта!
    Наше маленькое сообщество обожает игры в жанре [b]%s[/b]. На чём, по-вашему, нам стоит сосредоточиться, если мы хотим сделать игру?
  LABEL_INTERVIEW_INDIE_RIGHT: |
    Наш эксперт Дориан согласен, как и сообщество [i]3615 Dorian[/i]. [b]%s[/b] - это самородок, которого мы все так ждали!
  LABEL_INTERVIEW_BIG: |
    Здравствуйте,
    Я Джио Тард, работаю в [i]Rock Paper Pistol[/i]. [b]%s[/b] кажется многообещающим, я хотел бы задать вам несколько вопросов для статьи.
    У вас есть 5 минут?
  LABEL_INTERVIEW_BIG_QUESTION: |
    После [b]%d[/b] лет существования вы публикуете свою первую ААА-игру. С [b]%s[/b] вы вступаете в высшую лигу отрасли.
    Мы хотели бы знать, будет ли [b]%s[/b] названа Игрой [b]%d[/b] года?
  LABEL_INTERVIEW_BIG_ANSWER_RIGHT: |
    [b]%s[/b] явно владеет хрустальным шаром! Предсказать, кто будет номинирован на «Игру года», непросто!
    Чтобы быть такими дальновидными, они должны знать, как устроена отрасль изнутри!
  LABEL_INTERVIEW_BIG_ANSWER_WRONG: |
    Ошибиться может кто угодно: вы, я, все. Но одно можно сказать точно: [b]%s[/b] не смог предсказать будущее!
    Люди больше учатся на своих ошибках, чем на своих успехах. В любом случае, это то, что мы, вероятно, часто слышим на [b]%s[/b].
  LABEL_INTERVIEW_BIG_YES: |
    Что ж, после стольких трудов это точно.
  LABEL_INTERVIEW_BIG_NO: |
    Мы бы первыми удивились, если бы это было так!
  LABEL_INTERVIEW_REFUSAL: |
    Простите, что отнял у вас время.
  LABEL_INTERVIEW_ACCEPT: |
    Конечно.
