  LABEL_SAVEGAME_ALREADY_EXISTS: |
    De save "%s" bestaat al.

    Wil je deze overschrijven?
  LABEL_COPY_PROTECTION: Kopieerbescherming
  TOOLTIP_COPY_PROTECTION: |
    Het toevoegen van kopieerbescherming helpt een zekere kwaliteit te garanderen voor games die op je console worden uitgebracht.
    Om games op je console uit te kunnen brengen,
    hebben bedrijven namelijk toegang nodig tot een officiële devkit.

    Als je eind jaren 70 of begin jaren 80 een console uitbrengt,
    helpt het toevoegen van kopieerbescherming je de crash van 1983 te vermijden.
  TOOLTIP_GOTY_PUBLICATION: |
    Ongeacht de grootte van het originele spel, is de Game of the Year-editie altijd van normale grootte.
    Dit komt omdat een Game of the Year-editie het basisspel neemt en kleine wijzigingen toevoegt die
    voornamelijk cosmetisch zijn.
  LABEL_STUDIODIRECTOR_MAKE_GAME: Spellen maken
  LABEL_STUDIODIRECTOR_UPDATE_GAME: Spellen updaten
  LABEL_STUDIODIRECTOR_PORT_GAME: Spellen porten
  TOOLTIP_STUDIODIRECTOR_MAKE_GAME: |
    Stelt de studiodirecteur in staat om spellen te maken.
  TOOLTIP_STUDIODIRECTOR_UPDATE_GAME: |
    Stelt de studiodirecteur in staat om spellen te updaten.
  TOOLTIP_STUDIODIRECTOR_PORT_GAME: |
    Stelt de studiodirecteur in staat om spellen te porten.
  LABEL_PLATFORM_COMPATIBILITY_MIN: Minimale platformcompatibiliteit om het spel te porten
  LABEL_STUDIODIRECTOR_GAMEPORT: Spellen naar andere consoles porten
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE: Te porten spellen
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_SELF_GAMES: Spellen geproduceerd door deze studiodirecteur
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_ALL_GAMES: Alle spellen die geport kunnen worden
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_MARKETSHARE: |
    Gebruikt het marktaandeel van de console om te bepalen of een game wordt geport.
    Als het marktaandeel lager is dan de waarde, dan wordt de game niet naar de console geport.
    Maar als het marktaandeel van de console groter of gelijk is, dan wordt de game naar de console geport.

    De meter op 0 zetten betekent alle games naar alle beschikbare platforms porten.
  LABEL_PLATFORM_MARKETSHARE_MIN: Minimaal marktaandeel
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_COMPATIBILITY: |
    Elk platform heeft een compatibiliteitspercentage met een ander platform.
    Hoe hoger de compatibiliteit, hoe succesvoller de port zal zijn.
    Omgekeerd, hoe lager de compatibiliteit, hoe lager de beoordeling van de port zal zijn.
  TOOLTIP_CANNOT_PILOT_TRADE_PUBLISHED_GAME: |
    Dit spel werd uitgebracht met hulp van een ander bedrijf dat alle marketing verzorgt.

    Om deze reden kun je geen kortingsacties of marketingcampagnes organiseren.
  LABEL_OPTION_120_FPS: Forceer 120 FPS
  TOOLTIP_OPTION_120_FPS: |
    Dwingt het spel om 120 frames per seconde weer te geven.
    Standaard geeft het spel 60 frames per seconde weer.

    Deze optie kan leiden tot instabiliteit.
    Als je problemen ondervindt, kun je overwegen deze uit te schakelen.
  LABEL_OPTION_PARTICLE: Werknemersdeeltjes
  LABEL_OPTION_SEASON: Seizoenweergave
  TOOLTIP_OPTION_PARTICLE: |
    Toont een kleine bel boven het hoofd van een werknemer wanneer deze punten produceert voor een spel of een ander project.

    Het uitschakelen van deze optie kan de prestaties aanzienlijk verbeteren.
  TOOLTIP_OPTION_SEASON: |
    De stadskaart verandert van kleur op basis van de seizoenen.

    Deze optie heeft weinig invloed op de prestaties.
  TOOLTIP_OPTION_ANISOTROPIC_FILTER: |
    Verbetert de weergave van texturen in het spel.

    Deze optie heeft weinig invloed op de prestaties.
  TOOLTIP_OPTION_CLOUDS: |
    De stadskaart toont wolken.

    Deze optie heeft weinig invloed op de prestaties.
  LABEL_GAME_OF_THE_YEAR_WINNER: Winnaar
  LABEL_GAME_OF_THE_YEAR_RUNNERS_UP: Finalisten
  LABEL_NOMINATED: Genomineerd
  TOOLTIP_GAME_OF_THE_YEAR_REQUIREMENT_NOT_FULLFILLED: |
    Om een Game of the Year-trofee te plaatsen, moet een van je spellen de Game of the Year-prijs hebben gewonnen.

    Je kunt één trofee per overwinning plaatsen.
  TOOLTIP_GOTY_ALREADY_PUBLISHED: |
    Je hebt de Game of the Year-editie al van dit spel uitgebracht.
  TOOLTIP_NOT_UNLOCKED_YET: Nog niet ontgrendeld
  LABEL_REMOVE_GAME_FROM_SHELVES: >
    Je spel %s is van de markt gehaald. Een spel blijft daar minimaal 6 maanden en wordt vervolgens automatisch verwijderd als het over een periode van 6 maanden minder dan $ 1.000 per maand genereert.
  LABEL_WINDOWED: Venster
  LABEL_WINDOWED_BORDERLESS: Venster zonder rand
  LABEL_FULLSCREEN_BORDERLESS: Volledig scherm zonder rand
  TOOLTIP_STUDIO_DIRECTOR_UPDATE_GAME: |
    Kies de updatestrategie van de directeur:

    • Geen updates: richt zich uitsluitend op het maken van nieuwe games
    • Alleen eigen games: werkt alleen games bij die hij heeft ontwikkeld
    • Alle games: beheert updates voor de gehele beschikbare catalogus

    Na voltooiing van de updates hervat de directeur de ontwikkeling van nieuwe projecten.
  TOOLTIP_STUDIO_DIRECTOR_MAXIMUM_VALUE: |
    Je kunt maximaal %s studiodirecteuren werven.
  
    Om de spelbalans te behouden, moedigt deze limiet strategisch management aan.

    Tip:
    Werf ervaren directeuren die meerdere studio's tegelijkertijd kunnen
    overzien om ambitieuzere projecten te ontwikkelen!
  TOOLTIP_HISTORICAL_MODE: |
    Historische modus:
  
    • Ingeschakeld: Volledige trouw aan de echte videogamegeschiedenis
    • Uitgeschakeld: Concurrenten kunnen hun eigen consoles maken
  LABEL_COMPANY_FOUNDED_IN: Bedrijf opgericht in %s
  LABEL_FIRST_GAME_ENGINE_DATE: Eerste game-engine
  LABEL_FIRST_STUDIO_BOUGHT_DATE: Eerste studio verworven
  LABEL_DIGITAL_STORE_CREATION_DATE: Digitale winkel geopend
  LABEL_FIRST_CUSTOM_PLATFORM_DATE: Eerste console uitgebracht
  LABEL_FANBASE_THRESHOLD_DATE: "%s fans bereikt"
  LABEL_NUMBER_OF_ONLINE_USER_DIGITAL_STORE: Gebruikers digitale winkel
  LABEL_AMOUNT_OF_PLATFORM_CREATED: Ontwikkelde consoles
  LABEL_AMOUNT_EDITED_REMAKE: Uitgebrachte remakes
  LABEL_AMOUNT_OF_GOTY: Game of the Year-prijzen
  LABEL_AMOUNT_OF_GAME_ENGINE: Ontwikkelde game-engines
  LABEL_AMOUNT_OF_EMPLOYEE: Werknemers
  LABEL_AMOUNT_OF_GAMEPORT: Game-ports
  LABEL_AMOUNT_OF_GAMES: Uitgebrachte games
  LABEL_AMOUNT_OF_STUDIOS: Studio's
  LABEL_AMOUNT_OF_CONVENTIONS: Bezochte beurzen
  TOOLTIP_STAFF_SCHEDULE_AUTO: |
    Wijst automatisch werknemers toe.

    Ontwerpers worden toegewezen aan ontwerptaken, ontwikkelaars aan ontwikkelingstaken
    en testers aan afwerktaken.

    Terwijl geprobeerd wordt de studio's in balans te houden.
  TOOLTIP_STAFF_SCHEDULE_RESET: |
    Reset medewerkertoewijzingen.
  TOOLTIP_STAFF_SCHEDULE_CANNOT_AUTO_TOO_SMALL: |
    Het is onmogelijk om werknemers automatisch toe te wijzen in studio's met minder dan 5 werknemers.
  TOOLTIP_STUDIO_AREA_TOO_SMALL: |
    De studio-oppervlakte is kleiner dan die van de originele studio.
    Daarom is het niet mogelijk om de meubelopstelling van de doelstudio te kopiëren.
  TOOLTIP_STUDIODIRECTOR_DESCRIPTION: |
    Je kunt elk aspect van het maken van een game configureren door de automatische instellingen uit te schakelen.

    Standaard neemt de studiodirecteur de beste beslissingen zonder rekening te houden met je algemene strategie.
    Hij stelt de kwaliteit van games boven de financiële gezondheid van het bedrijf.

    Standaard kondigt de studiodirecteur games niet aan en werkt hij ze niet bij, maar je kunt hem vragen dit te doen.
    Hij maakt echter automatisch de spelrapporten.

  TOOLTIP_STUDIODIRECTOR_ACTIVATION: |
    Om een studiodirecteur te activeren, wijs je studio's aan hem toe.
    Om hem te deactiveren, verwijder je alle studio's die aan hem zijn toegewezen.

    Games en updates die momenteel in ontwikkeling zijn, worden automatisch geannuleerd.

  LABEL_STUDIODIRECTOR_SPECIALIST_TO_USE: >
    Geef de studiodirecteur toestemming om specialisten te gebruiken.
    Dit betekent dat de studiodirecteur altijd probeert de specialisten te gebruiken die beschikbaar zijn onder de specialisten die hier zijn toegestaan.
    Dus als een studiodirecteur toestemming heeft om accountants te gebruiken, zal hij ze aan zijn spellen toewijzen zolang er accountants beschikbaar zijn.
  LABEL_HIDE_STUDIO_NOT_AVAILABLE: Onbeschikbare studio's verbergen
  LABEL_IF_POSSIBLE: "(indien mogelijk)"
  LABEL_PREFER_MANUAL_SELECTION: Zelf kiezen
  LABEL_PREFER_NEW_TYPE: Spelgenre niet beheerst
  LABEL_PREFER_MASTERED_TYPE: Spelgenre beheerst
  LABEL_PREFER_PRODUCER_TYPE: Spelgenre van producent
  LABEL_PREFER_THE_MOST_FEATURES: Meeste functies
  LABEL_PREFER_THE_CHEAPEST: Goedkoopste
  LABEL_PREFER_MOST_POWERFUL: Krachtigste
  LABEL_PREFER_HOME_MADE: Intern
  LABEL_PREFER_MARKET_SHARE: Grootste marktaandeel
  LABEL_PREFER_SMALLEST_CATALOG_SIZE: Kleinste spelcatalogus
  LABEL_PRIORITIZE_PROFIT: Winst eerst
  LABEL_PRIORITIZE_FANBASE_GROW: Groei van de fanbase eerst
  LABEL_BONUS_PROFIT_SHARE: Winstdeling
  TOOLTIP_BONUS_PROFIT_SHARE: |
    De studiodirecteur ontvangt een vast percentage van de winst die wordt gegenereerd door de spellen die hij heeft geproduceerd.
    Deze bonus garandeert een stabiele beloning en motiveert hem om door te gaan met het produceren van hoogwaardige games en optimale prestaties te leveren.
  LABEL_PUBLISH_ALL_GAMES: Alle games publiceren
  TOOLTIP_PUBLISH_ALL_GAMES: |
    Je kunt ervoor kiezen om alle games die door de studiodirecteur zijn gemaakt te publiceren.
    Of je kunt alleen games van een bepaalde kwaliteit publiceren.
    Andere games worden automatisch weggegooid.
  LABEL_STUDIO_DIRECTOR_REVIEW: Persbeoordelingen van de games van de directeur tonen
  LABEL_STUDIO_DIRECTOR: Studiodirecteur
  LABEL_STUDIO_DIRECTOR_CUT: Winstdeling van de studiodirecteuren
  TOOLTIP_STUDIO_DIRECTOR: |
    Een studiodirecteur kan games ontwikkelen en zelfstandig updaten.
    Wijs hem zoveel studio's toe als je wilt, zodat hij games kan maken en updates kan beheren.
    De studiodirecteur maakt gebruik van alle werknemers in die studio's: ontwikkelaars,
    producenten, netwerkbeheerders, accountants en marketingmanagers.
  LABEL_AUTO_PAUSE: Automatische pauze bij publiceren
  TOOLTIP_AUTO_PAUSE_GAME: |
    Het spel wordt automatisch gepauzeerd wanneer je een videogame publiceert.
  LABEL_COMPETITION_FANBASE_ACQUISITION: >
    Fans gewonnen door de overname van de concurrent
  LABEL_ACQUIRE_COMPANY_DESCRIPTION: |
    Je staat op het punt een concurrent over te nemen.

    Deze overname zal de fanbase van je bedrijf vergroten.
    Je kunt ook kiezen of je hun werknemers, studio's en games wilt overnemen.
    Of dat je van ze af wilt.
  LABEL_GET_ALL_STUDIO: Alle studio's overnemen
  LABEL_HIRE_ALL: Al het personeel overnemen
  LABEL_GET_ALL_GAME: Alle games overnemen
  LABEL_GET_ALL_PLATFORM: Alle platforms overnemen
  LABEL_UPCOMING_GAME: Zet het vandaag op je verlanglijst!
  LABEL_BANKER_GOODBYE_MESSAGE: Bedankt voor uw tijd en overweging. We zullen verdergaan op basis van uw uiteindelijke beslissing. Als u verdere hulp nodig heeft, laat het ons dan weten.
  LABEL_BANKER_SELL_ALL_YOUR_SHARE: >
    Verkoop alle aandelen die u bezit van elke concurrent
  LABEL_BANKER_SELL_ALL_YOUR_SHARE_MESSAGE: >
    Weet u zeker dat u dit aanbod wilt accepteren? Door te accepteren verkoopt u al uw aandelen!
  LABEL_BANKER_SELL_SHARE_CONFIRM: >
    Accepteren, alles verkopen.
  LABEL_BANKER_SELL_SHARE_CANCEL: >
    Annuleren, er moet een andere manier zijn.
  LABEL_BANKER_STATE_LOAN: >
    De staat biedt aan uw schuld te betalen in ruil voor een extra belasting van %d%% gedurende %d jaar
  LABEL_BANKER_STATE_LOAN_MESSAGE: >
    Weet u zeker dat u dit aanbod wilt accepteren? Door te accepteren moet u %d%% extra belasting betalen. Dit duurt %d jaar.
  LABEL_BANKER_STATE_LOAN_CONFIRM: >
