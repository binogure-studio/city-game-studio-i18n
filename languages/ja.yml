  LABEL_GOTY_AWARD: ゲーム・オブ・ザ・イヤー受賞数
  LABEL_SEARCH: 検索
  LABEL_FRANCHISE: フランチャイズ
  LABEL_FRANCHISE_FATIGUE: 疲労度
  TOOLTIP_FRANCHISE_FATIGUE: |
    フランチャイズが新作を出せる状態かどうかを確認できます。
    疲労度が0に近いほど、新作を出す準備が整っています。
    疲労度が高いほど、新作を発売するまでに待つ必要があります。

    移植は疲労度の影響を受けません。
  LABEL_THEME_INTERFACE: インターフェーステーマ
  LABEL_LIGHT_THEME: ライトテーマ
  LABEL_DARK_THEME: ダークテーマ
  LABEL_SOLARI_THEME: Solariテーマ
  LABEL_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: 最低幸福度
  TOOLTIP_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: |
    従業員の幸福度が設定された限界を下回ると、自動的に休暇に送ります。

    従業員が不幸だと、仕事の効率が落ち、より頻繁に休暇を取るようになります。
    従業員の生産性を高めるためには、あまりに不幸になる前に休暇に送るのが良いでしょう。
  TOOLTIP_STUDIO_DIRECTOR_SEQUEL: |
    ディレクターの続編戦略を選択：

    • 続編なし：新しいゲームの作成のみに専念
    • 自分のゲームのみ：開発したゲームの続編のみを作成
    • すべてのゲーム：利用可能なカタログ全体の続編を作成

    完了すると、ディレクターは新しいプロジェクトの開発を再開します。
