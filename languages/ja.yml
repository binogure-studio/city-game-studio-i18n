  LABEL_EVENT_STOCK_CONCURRENT_BUY_TITLE: "%sが%sの買収を希望！"
  LABEL_EVENT_STOCK_CONCURRENT_BUY_DESCRIPTION: |
    [b]%s[/b]様。

    当社は[b]%s[/b]を買収することに興味があります。
    しかし、あなたは現在、会社の株式の50%%以上を保有しています。
