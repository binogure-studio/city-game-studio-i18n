  LABEL_SAVEGAME_ALREADY_EXISTS: |
    Сохранение "%s" уже существует.

    Хотите перезаписать его?
  LABEL_COPY_PROTECTION: Защита от копирования
  TOOLTIP_COPY_PROTECTION: |
    Добавление защиты от копирования помогает обеспечить определённое качество игр, выпускаемых на вашей консоли.
    Ведь чтобы компании могли выпускать игры на вашей консоли,
    им нужен доступ к официальному девкиту.

    Если вы выпустите консоль в конце 70-х или начале 80-х,
    добавление защиты от копирования поможет вам избежать краха 1983 года.
  TOOLTIP_GOTY_PUBLICATION: |
    Независимо от размера оригинальной игры, издание «Игра года» всегда имеет обычный размер.
    Это объясняется тем, что издание «Игра года» берёт базовую игру и добавляет незначительные
    изменения, которые в основном являются косметическими.
  LABEL_STUDIODIRECTOR_MAKE_GAME: Создавать игры
  LABEL_STUDIODIRECTOR_UPDATE_GAME: Обновлять игры
  LABEL_STUDIODIRECTOR_PORT_GAME: Портировать игры
  TOOLTIP_STUDIODIRECTOR_MAKE_GAME: |
    Позволяет директору студии создавать игры.
  TOOLTIP_STUDIODIRECTOR_UPDATE_GAME: |
    Позволяет директору студии обновлять игры.
  TOOLTIP_STUDIODIRECTOR_PORT_GAME: |
    Позволяет директору студии портировать игры.
  LABEL_PLATFORM_COMPATIBILITY_MIN: Минимальная совместимость платформы для портирования игры
  LABEL_STUDIODIRECTOR_GAMEPORT: Портировать игры на другие консоли
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE: Игры для портирования
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_SELF_GAMES: Игры, созданные этим директором студии
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_ALL_GAMES: Все игры, которые можно портировать
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_MARKETSHARE: |
    Использует долю рынка консоли, чтобы решить, портировать ли на неё игру.
    Если доля рынка консоли ниже этого значения, игра не будет на неё портирована.
    Если она больше или равна этому значению, игра будет на неё портирована.

    Значение 0 означает портирование всех игр на все доступные платформы.
  LABEL_PLATFORM_MARKETSHARE_MIN: Минимальная доля рынка
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_COMPATIBILITY: |
    Каждая платформа имеет уровень совместимости с другой платформой.
    Чем выше совместимость, тем успешнее будет порт.
    И наоборот, чем ниже совместимость, тем ниже будет оценка порта.
  TOOLTIP_CANNOT_PILOT_TRADE_PUBLISHED_GAME: |
    Эта игра была опубликована с помощью другой компании, которая занимается всем маркетингом.

    По этой причине вы не можете организовывать распродажи или маркетинговые кампании.
  LABEL_OPTION_120_FPS: Принудительно 120 FPS
  TOOLTIP_OPTION_120_FPS: |
    Заставляет игру отображать 120 кадров в секунду.
    По умолчанию игра отображает 60 кадров в секунду.

    Эта опция может привести к нестабильности.
    Если возникнут проблемы, рассмотрите возможность её отключения.
  LABEL_OPTION_PARTICLE: Частицы сотрудников
  LABEL_OPTION_SEASON: Отображение сезонов
  TOOLTIP_OPTION_PARTICLE: |
    Отображает маленький пузырь над головой сотрудника, когда он производит очки для игры или любого другого проекта.

    Отключение этой опции может значительно улучшить производительность.
  TOOLTIP_OPTION_SEASON: |
    Карта города меняет цвет в зависимости от сезона.

    Эта опция мало влияет на производительность.
  TOOLTIP_OPTION_ANISOTROPIC_FILTER: |
    Улучшает отображение текстур в игре.

    Эта опция мало влияет на производительность.
  TOOLTIP_OPTION_CLOUDS: |
    На карте города отображаются облака.

    Эта опция мало влияет на производительность.
  LABEL_GAME_OF_THE_YEAR_WINNER: Победитель
  LABEL_GAME_OF_THE_YEAR_RUNNERS_UP: Финалисты
  LABEL_NOMINATED: Номинирован
  TOOLTIP_GAME_OF_THE_YEAR_REQUIREMENT_NOT_FULLFILLED: |
    Чтобы разместить трофей «Игра года», одна из ваших игр должна выиграть награду «Игра года».

    Вы можете разместить один трофей за каждую победу.
  TOOLTIP_GOTY_ALREADY_PUBLISHED: |
    Вы уже опубликовали издание «Игра года» для этой игры.
  TOOLTIP_NOT_UNLOCKED_YET: Ещё не разблокировано
  LABEL_REMOVE_GAME_FROM_SHELVES: >
    Ваша игра %s была удалена с рынка. Игра остается на рынке минимум 6 месяцев, затем автоматически удаляется, если приносит менее 1 000 $ в месяц в течение 6 месяцев.
  LABEL_WINDOWED: Оконный режим
  LABEL_WINDOWED_BORDERLESS: Окно без рамки
  LABEL_FULLSCREEN_BORDERLESS: Полный экран без рамки
  TOOLTIP_STUDIO_DIRECTOR_UPDATE_GAME: |
    Выберите стратегию обновлений директора:

    • Без обновлений: сосредоточен исключительно на создании новых игр
    • Только свои игры: обновляет только игры, которые разработал
    • Все игры: управляет обновлениями всего доступного каталога

    После завершения обновлений директор возобновляет разработку новых проектов.
  TOOLTIP_STUDIO_DIRECTOR_MAXIMUM_VALUE: |
    Вы можете нанять до %s директоров студий.
  
    Для сохранения баланса игры это ограничение поощряет стратегическое управление.

    Совет:
    Нанимайте опытных директоров, способных одновременно курировать несколько студий
    для разработки более амбициозных проектов!
  TOOLTIP_HISTORICAL_MODE: |
    Исторический режим:
  
    • Включён: Полное соответствие реальной истории видеоигр
    • Отключён: Конкуренты могут создавать собственные консоли
  LABEL_COMPANY_FOUNDED_IN: Компания основана в %s
  LABEL_FIRST_GAME_ENGINE_DATE: Первый игровой движок
  LABEL_FIRST_STUDIO_BOUGHT_DATE: Первая приобретенная студия
  LABEL_DIGITAL_STORE_CREATION_DATE: Цифровой магазин создан
  LABEL_FIRST_CUSTOM_PLATFORM_DATE: Первая выпущенная консоль
  LABEL_FANBASE_THRESHOLD_DATE: Достигнуто %s фанатов
  LABEL_NUMBER_OF_ONLINE_USER_DIGITAL_STORE: Пользователи цифрового магазина
  LABEL_AMOUNT_OF_PLATFORM_CREATED: Созданные консоли
  LABEL_AMOUNT_EDITED_REMAKE: Выпущенные ремейки
  LABEL_AMOUNT_OF_GOTY: Награды «Игра года»
  LABEL_AMOUNT_OF_GAME_ENGINE: Разработанные игровые движки
  LABEL_AMOUNT_OF_EMPLOYEE: Сотрудники
  LABEL_AMOUNT_OF_GAMEPORT: Портированные игры
  LABEL_AMOUNT_OF_GAMES: Выпущенные игры
  LABEL_AMOUNT_OF_STUDIOS: Студии
  LABEL_AMOUNT_OF_CONVENTIONS: Посещенные выставки
  TOOLTIP_STAFF_SCHEDULE_AUTO: |
    Автоматически назначает сотрудников.

    Дизайнеры будут назначены на задачи дизайна, разработчики на задачи разработки,
    а тестировщики на задачи полировки.

    При этом пытается сбалансировать студии.
  TOOLTIP_STAFF_SCHEDULE_RESET: |
    Сбрасывает назначения сотрудников.
  TOOLTIP_STAFF_SCHEDULE_CANNOT_AUTO_TOO_SMALL: |
    Невозможно автоматически назначить сотрудников в студиях с менее чем 5 сотрудниками.
  TOOLTIP_STUDIO_AREA_TOO_SMALL: |
    Площадь студии меньше, чем у исходной студии.
    Поэтому невозможно скопировать планировку мебели целевой студии.
  TOOLTIP_STUDIODIRECTOR_DESCRIPTION: |
    Вы можете настроить каждый аспект создания игры, отключив автоматические настройки.

    По умолчанию директор студии будет принимать лучшие решения, не учитывая вашу общую стратегию.
    Он будет отдавать предпочтение качеству игр, а не финансовому состоянию компании.

    По умолчанию директор студии не анонсирует игры и не обновляет их, но вы можете попросить его сделать это.
    Однако он автоматически генерирует отчёты об играх.

  TOOLTIP_STUDIODIRECTOR_ACTIVATION: |
    Чтобы активировать директора студии, назначьте ему студии.
    Чтобы деактивировать, уберите все студии, назначенные ему.

    Игры и обновления, находящиеся в разработке, будут автоматически отменены.

  LABEL_STUDIODIRECTOR_SPECIALIST_TO_USE: >
    Разрешить директору студии использовать специалистов.
    Это означает, что директор студии всегда будет стараться использовать тех специалистов, которые доступны среди разрешенных здесь.
    Так, если директору студии разрешено использовать бухгалтеров, он будет назначать их на свои игры до тех пор, пока есть доступные бухгалтеры.
  LABEL_HIDE_STUDIO_NOT_AVAILABLE: Скрыть недоступные студии
