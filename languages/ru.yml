  LABEL_ADOPT_CAT_DESCRIPTION: "Сотрудники студии [b]%s[/b] нашли бездомную кошку, спрятавшуюся за мусором. Кошка очень ласковая, и сотрудники уже дали ей имя. Что будете делать?"
  LABEL_ADOPT_CAT_TITLE: Бездомная кошка
  LABEL_UNLOCK_MYSTERY_LIKE_DESCRIPTION: "В Blue Studio два брата только что выпустили новую игру. Она меняет правила игры, и появился новый жанр: Mystery-подобные игры."
  LABEL_UNLOCK_MYSTERY_LIKE_TITLE: "Изобретён жанр Mystery-подобных игр"
  LABEL_UNLOCK_HTA_LIKE_DESCRIPTION: "DustStar только что выпустила новую игру, которая произвела революцию в игровой индустрии. Она породила жанр HTA-подобных игр."
  LABEL_UNLOCK_HTA_LIKE_TITLE: "Изобретён жанр HTA-подобных игр"
  LABEL_UNLOCK_CROOK_LIKE_TYPE_DESCRIPTION: "3 парня в гараже создали совершенно новую игру. Она настолько знаменита, что породила новый игровой жанр: Crook-подобные игры."
  LABEL_UNLOCK_CROOK_LIKE_TYPE_TITLE: "Изобретён жанр Crook-подобных игр"
  LABEL_UNLOCK_MOBA_LIKE_DESCRIPTION: "3 американских дизайнера только что создали мод для знаменитой игры. Родился жанр MOBA."
  LABEL_UNLOCK_MOBA_LIKE_TITLE: "Изобретён жанр MOBA-подобных игр"
  LABEL_BROKEN_COFFEEMAKER_TITLE: Сломанная кофемашина
  LABEL_BROKEN_COFFEEMAKER_DESCRIPTION: "Сотрудники студии [b]%s[/b] жить не могут без кофе. Но кофемашина приготовила последнюю чашку..."
  LABEL_RABBIT_INVASION_DESCRIPTION: "Кролики, кролики повсюду. Они шумят... носятся повсюду. Но их никто не замечает, и все продолжают работать..."
  LABEL_RABBIT_INVASION_TITLE: Кроличье вторжение
  LABEL_TARGETTED_AUDIENCE_FEATURE: "Эксперты обнаружили, что игры могут ориентироваться на определённую аудиторию. Они опубликовали статью о трёх разных аудиториях: дети, все и взрослые."
  LABEL_VIRUS_UNLEASHED_DESCRIPTION: "Появился неизвестный вирус, нацеленный на компании, разрабатывающие видеоигры. Это кажется странным, но он замедляет курсоры и случайным образом перезагружает компьютеры. Это, безусловно, скажется на производительности ваших сотрудников. Атаке подвергается только [b]%s[/b]."
  LABEL_VIRUS_UNLEASHED_TITLE: Появился вирус
  LABEL_VLOGGER_PUBLISH_A_VIDEO_ABOUT_YOUR_GAME_DESCRIPTION: "The Smitties, известные своими обзорами игр, только что опубликовали новое видео. Они сделали обзор [b]%s[/b], и это ВАША игра! Это повлияет на продажи."
  LABEL_VLOGGER_PUBLISH_A_VIDEO_ABOUT_YOUR_GAME_TITLE: Бесплатная реклама
  LABEL_LOAN_TITLE: Заём последней надежды
  LABEL_LOAN_DESCRIPTION: "Вам нужны дополнительные деньги, и мы можем помочь. Вы можете выкрутиться с помощью займа в [b]%s$[/b]. Наши процентные ставки составляют всего [b]%s%%[/b], а на погашение у вас есть [b]%s[/b] недель. Для такой компании, как ваша, это целая вечность. Мы ваш последний вариант, позвольте себя соблазнить."
  LABEL_BURNING_SERVER_DESCRIPTION: |
    Пахнет гарью?!
    Ваши серверы достигли предела мощности.
    Пора покупать новые серверы или закрывать онлайн-игру!
  LABEL_BURNING_SERVER_TITLE: Всё в порядке
  LABEL_SMOKING_SERVER_DESCRIPTION: |
    Вы делаете очень хорошие онлайн-игры, и они отлично продаются.
    Однако ваши серверы почти исчерпали свою мощность: большинство из них загружены на 90%% и более.
    Вам стоит купить новые серверы.
  LABEL_SMOKING_SERVER_TITLE: Предупреждение о нагрузке на серверы
