  LABEL_SAVEGAME_ALREADY_EXISTS: |
    セーブ「%s」は既に存在します。

    上書きしますか？
  LABEL_COPY_PROTECTION: コピープロテクション
  TOOLTIP_COPY_PROTECTION: |
    コピープロテクションを追加することで、コンソールで公開されるゲームの品質を確保できます。
    というのも、企業がコンソールでゲームを公開するには、
    公式開発キットへのアクセスが必要です。

    70年代後半または80年代初頭にコンソールをリリースする場合、
    コピープロテクションを追加することで1983年のクラッシュを回避できます。
  TOOLTIP_GOTY_PUBLICATION: |
    元のゲームのサイズに関係なく、ゲーム・オブ・ザ・イヤー版は常に通常サイズです。
    これは、ゲーム・オブ・ザ・イヤー版がベースゲームに主に見た目の小さな変更を加えたものだからです。
  LABEL_STUDIODIRECTOR_MAKE_GAME: ゲームを作成
  LABEL_STUDIODIRECTOR_UPDATE_GAME: ゲームを更新
  LABEL_STUDIODIRECTOR_PORT_GAME: ゲームを移植
  TOOLTIP_STUDIODIRECTOR_MAKE_GAME: |
    スタジオディレクターがゲームを作成できるようにします。
  TOOLTIP_STUDIODIRECTOR_UPDATE_GAME: |
    スタジオディレクターがゲームを更新できるようにします。
  TOOLTIP_STUDIODIRECTOR_PORT_GAME: |
    スタジオディレクターがゲームを移植できるようにします。
  LABEL_PLATFORM_COMPATIBILITY_MIN: ゲームを移植するための最低プラットフォーム互換性
  LABEL_STUDIODIRECTOR_GAMEPORT: 他のコンソールへゲームを移植
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE: 移植するゲーム
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_SELF_GAMES: このスタジオディレクターが制作したゲーム
  LABEL_STUDIODIRECTOR_GAMEPORT_TYPE_PORT_ALL_GAMES: 移植可能なすべてのゲーム
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_MARKETSHARE: |
    コンソールの市場シェアをもとに、ゲームを移植するかどうかを判断します。
    コンソールの市場シェアがこの値より低い場合、ゲームはそのコンソールに移植されません。
    この値以上の場合、ゲームはそのコンソールに移植されます。

    ゲージを0に設定すると、すべてのゲームを利用可能なすべてのプラットフォームに移植します。
  LABEL_PLATFORM_MARKETSHARE_MIN: 最低市場シェア
  TOOLTIP_STUDIODIRECTOR_GAMEPORT_COMPATIBILITY: |
    各プラットフォームは他のプラットフォームとの互換性率があります。
    互換性が高いほど、移植の成功率が高くなります。
    逆に、互換性が低いほど、移植の評価は低くなります。
  TOOLTIP_CANNOT_PILOT_TRADE_PUBLISHED_GAME: |
    このゲームは、マーケティング全体を担当する別の会社の協力を得て発売されました。

    そのため、セールやマーケティングキャンペーンを企画することはできません。
  LABEL_OPTION_120_FPS: 120 FPSを強制
  TOOLTIP_OPTION_120_FPS: |
    ゲームを120フレーム/秒で表示するよう強制します。
    デフォルトでは、ゲームは60フレーム/秒で表示されます。

    このオプションは不安定性を引き起こす可能性があります。
    問題が発生した場合は、無効にすることを検討してください。
  LABEL_OPTION_PARTICLE: 従業員パーティクル
  LABEL_OPTION_SEASON: 季節の表示
  TOOLTIP_OPTION_PARTICLE: |
    従業員がゲームやその他のプロジェクトのポイントを生成すると、頭上に小さな吹き出しが表示されます。

    このオプションを無効にすると、パフォーマンスが大幅に向上する場合があります。
  TOOLTIP_OPTION_SEASON: |
    都市マップが季節に応じて色を変えます。

    このオプションはパフォーマンスへの影響が少ないです。
  TOOLTIP_OPTION_ANISOTROPIC_FILTER: |
    ゲーム内のテクスチャのレンダリングを改善します。

    このオプションはパフォーマンスへの影響が少ないです。
  TOOLTIP_OPTION_CLOUDS: |
    都市マップに雲が表示されます。

    このオプションはパフォーマンスへの影響が少ないです。
  LABEL_GAME_OF_THE_YEAR_WINNER: 受賞作
  LABEL_GAME_OF_THE_YEAR_RUNNERS_UP: 次点
  LABEL_NOMINATED: ノミネート済み
  TOOLTIP_GAME_OF_THE_YEAR_REQUIREMENT_NOT_FULLFILLED: |
    ゲーム・オブ・ザ・イヤーのトロフィーを配置するには、あなたのゲームの1つがゲーム・オブ・ザ・イヤー賞を受賞している必要があります。

    受賞ごとに1つのトロフィーを配置できます。
  TOOLTIP_GOTY_ALREADY_PUBLISHED: |
    このゲームのゲーム・オブ・ザ・イヤー版は既に発売されています。
  TOOLTIP_NOT_UNLOCKED_YET: まだアンロックされていません
  LABEL_REMOVE_GAME_FROM_SHELVES: >
    あなたのゲーム %s が市場から削除されました。ゲームは最低6ヶ月間市場に残り、その後6ヶ月間月間1,000ドル未満の収益の場合、自動的に削除されます。
  LABEL_WINDOWED: ウィンドウモード
  LABEL_WINDOWED_BORDERLESS: ボーダーレスウィンドウ
  LABEL_FULLSCREEN_BORDERLESS: ボーダーレスフルスクリーン
  TOOLTIP_STUDIO_DIRECTOR_UPDATE_GAME: |
    ディレクターのアップデート戦略を選択してください：

    • アップデートなし：新しいゲーム作成のみに集中
    • 自分のゲームのみ：開発したゲームのみ更新
    • 全てのゲーム：利用可能な全カタログの更新を管理

    アップデート完了後、ディレクターは新プロジェクトの開発を再開します。
  TOOLTIP_STUDIO_DIRECTOR_MAXIMUM_VALUE: |
    スタジオディレクターを最大%s人まで雇用できます。
  
    ゲームバランスを保つため、この制限は戦略的な管理を促進します。

    アドバイス：
    複数のスタジオを同時に監督し、より野心的なプロジェクトを
    開発できる経験豊富なディレクターを雇用しましょう！
  TOOLTIP_HISTORICAL_MODE: |
    歴史モード：
  
    • 有効：実際のビデオゲーム史に完全に忠実
    • 無効：競合他社が独自のコンソールを作成可能
  LABEL_COMPANY_FOUNDED_IN: "%s年に創業"
  LABEL_FIRST_GAME_ENGINE_DATE: 初のゲームエンジン
  LABEL_FIRST_STUDIO_BOUGHT_DATE: 初のスタジオ買収
  LABEL_DIGITAL_STORE_CREATION_DATE: デジタルストア開設
  LABEL_FIRST_CUSTOM_PLATFORM_DATE: 初のコンソール発売
  LABEL_FANBASE_THRESHOLD_DATE: ファン%s人達成
  LABEL_NUMBER_OF_ONLINE_USER_DIGITAL_STORE: デジタルストアユーザー数
  LABEL_AMOUNT_OF_PLATFORM_CREATED: 開発したコンソール
  LABEL_AMOUNT_EDITED_REMAKE: 発売したリメイク
  LABEL_AMOUNT_OF_GOTY: ゲーム・オブ・ザ・イヤー受賞
  LABEL_AMOUNT_OF_GAME_ENGINE: 開発したゲームエンジン
  LABEL_AMOUNT_OF_EMPLOYEE: 従業員数
  LABEL_AMOUNT_OF_GAMEPORT: 移植したゲーム
  LABEL_AMOUNT_OF_GAMES: 発売したゲーム
  LABEL_AMOUNT_OF_STUDIOS: スタジオ数
  LABEL_AMOUNT_OF_CONVENTIONS: 参加したコンベンション
  TOOLTIP_STAFF_SCHEDULE_AUTO: |
    従業員を自動的に割り当てます。

    デザイナーはデザイン作業に、開発者は開発作業に、
    テスターは仕上げ作業に割り当てられます。

    スタジオのバランスを取るよう努めます。
  TOOLTIP_STAFF_SCHEDULE_RESET: |
    従業員の割り当てをリセットします。
  TOOLTIP_STAFF_SCHEDULE_CANNOT_AUTO_TOO_SMALL: |
    5人未満の従業員のスタジオでは自動割り当てできません。
  TOOLTIP_STUDIO_AREA_TOO_SMALL: |
    スタジオの面積が元のスタジオより小さいです。
    そのため、対象スタジオの家具レイアウトをコピーすることができません。
  TOOLTIP_STUDIODIRECTOR_DESCRIPTION: |
    自動設定を無効にすることで、ゲーム制作のあらゆる側面を構成できます。

    デフォルトでは、スタジオディレクターは全体的な戦略を考慮せず、最良の決定を下します。
    彼は会社の財務健全性よりもゲームの品質を優先します。

    デフォルトでは、スタジオディレクターはゲームを発表したり、更新したりしませんが、これを依頼することができます。
    しかし、彼はゲームレポートを自動で生成します。

  TOOLTIP_STUDIODIRECTOR_ACTIVATION: |
    スタジオディレクターを有効にするには、スタジオを割り当ててください。
