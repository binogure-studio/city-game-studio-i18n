  LABEL_GAME_UPDATE_FEATURE: >
    Публикуйте обновления и создавайте новый контент для своих игр. Бесплатные или платные? Решать вам.
  LABEL_GAMEEDITION_SUBMIT: "У вас много фанатов. Вы достаточно известны, чтобы издавать игры."
  LABEL_GAMEEDITION_RECEIVE: "После вашего недавнего успеха издатели очень скоро свяжутся с вами со своими предложениями."
  LABEL_WORLDMAP: "Вы поднимаете взгляд: снаружи вас ждёт целый мир."
  LABEL_MARKETING_CAMPAIGN_MAGAZINE: "Появляются первые журналы о видеоиграх. Хотите прорекламировать в них одну из своих игр?"
  LABEL_MARKETING_CAMPAIGN_TV: Настало время сделать ваши игры известными благодаря телевизионной рекламе.
  LABEL_MARKETING_CAMPAIGN_INTERNET: >
    Эпоха Интернета начинается, вы можете охватить миллионы людей простым рекламным баннером.
  LABEL_CONCURRENT_STUDIOS_LIST: "Ваша студия растёт, пора изучить рынок и присмотреться к конкурентам."
  LABEL_CONCURRENT_STUDIOS_BUY: "Вы купаетесь в деньгах. Может быть, пора покупать конкурирующие студии?"
  LABEL_FURNITURES_COMMON_BUY: "Пора стильно обновить офис."
  LABEL_EMPLOYEES_HIRE: "Ваша студия растёт, выпускает больше игр и повышает их качество. Но сначала нужно набрать сотрудников."
  LABEL_STUDIO_RENT: "Вам уже тесно в вашей маленькой студии, пора найти новое помещение."
  LABEL_STUDIO_BUILD: Ваш успех позволяет вам строить собственные студии.
  LABEL_CONVENTION_ORGANIZE: "Вас поддерживают сто тысяч человек, и теперь вы можете организовывать собственные выставки."
  LABEL_CONVENTION_PARTICIPATE: "Ваш каталог игр заслуживает внимания, поэтому участие в выставках поможет повысить вашу известность."
  LABEL_STUDIO_CUSTOMIZE: "Скучные стены снижают вашу производительность? Пора их переделать."
  LABEL_GAME_ONLINE: "Как удержать игроков у экрана? ИНТЕРНЕТ. Делайте онлайн-игры, и они станут зависимыми!"
  LABEL_FURNITURES_SERVERS_BUY: "Больше столов, больше стульев, больше компьютеров, больше белых досок, больше, больше, больше!"
  LABEL_DIGITAL_STORE: "Цифровая дистрибуция? Вы начинаете о ней слышать и уже знаете, что это будущее."
  LABEL_POSTMORTEM_FEATURE: "Поздравляем, вы сделали свою первую игру. Теперь вы можете составить отчёт об игре, чтобы оценить её разработку, дизайн и полировку."
  LABEL_NEW_GAME_FEATURE: >
    Готовы пережить эпическую историю видеоигр с самого начала?
    Добро пожаловать в City Game Studio! Начните работу и создайте свою первую игру.
  LABEL_LOADING: Загрузка
  LABEL_NAME: Название
  LABEL_SALARY: Зарплата
  LABEL_NO_SCORE: Результатов пока нет!
  LABEL_CAPACITY_STORY_FEATURE: "Хорошая игра всегда хороша, хороший сюжет всегда хорош. А как насчёт хорошей игры с хорошим сюжетом?"
  LABEL_CAPACITY_USER_INTERFACE_FEATURE: "Для чего эта кнопка? Вам нужно продумывать пользовательский интерфейс ваших игр."
  LABEL_CAPACITY_NETWORK_FEATURE: "Играть в видеоигры потрясающе, но играть с друзьями ещё лучше! Вам нужно заниматься сетевой частью своих игр."
  LABEL_CAPACITY_MODDING_FEATURE: "Некоторые ваши игры уже модифицировали игроки, и благодаря этому вы продаёте больше игр. Пора помочь этим хакерам и поработать над полноценным API для моддинга ваших игр."
  LABEL_CAPACITY_CUTSCENES_FEATURE: "Кино влияет на видеоигры, и при создании новой игры нужно заниматься катсценами."
  LABEL_CAPACITY_TUTORIEL_FEATURE: "Играть в новую игру - всё равно что учиться. Это непросто, поэтому вы решили создавать обучение для своих новых игр."
  LABEL_MARKETING_CAMPAIGN_SOCIALNETWORK: "Рик и Пэрис выставляют напоказ свою личную жизнь. Социальные сети пришли надолго, и вы можете использовать их для продвижения своих игр!"
  LABEL_MARKETING_CAMPAIGN_MAILINGLIST: "Недавнее исследование показало, что рассылка нежелательных писем может значительно повысить известность ваших игр. Спам стал модным словом, и вы можете использовать его для продвижения своих игр!"
  LABEL_GAMEPORT_FEATURE: "Мечты сбываются. Только что вышла новая консоль! Вы можете выпустить кроссплатформенную игру. Вперёд, попробуйте!"
  LABEL_GAME_CREATION: "Оцените рабочую нагрузку каждой части вашей игры, настроив каждую шкалу."
  LABEL_GAMEEDITION_RECEIVE_DESCRIPTION_0: >
    Вы можете ознакомиться с предложениями издателей. Издание игры - это простой
    способ стать популярным и издавать большие игры.
  LABEL_WORLDMAP_DESCRIPTION_0: "Осмотрите город, присмотритесь к конкурентам и узнайте, где находится ваша студия."
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_0: >
    Позволяет организовать маркетинговую кампанию через многие игровые журналы.
    Это повысит популярность ваших игр.
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_1: "Позволяет арендовать рекламные щиты для размещения плакатов ваших игр, которые сейчас в продаже."
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_2: "Теперь вы можете нанимать менеджеров по маркетингу. Они усиливают ваши маркетинговые кампании!"
  LABEL_MARKETING_CAMPAIGN_TV_DESCRIPTION_0: >
    Позволяет организовывать телевизионные рекламные кампании. Это дорого, но
    кто не смотрит телевизор в наши дни?!
  LABEL_MARKETING_CAMPAIGN_INTERNET_DESCRIPTION_0: >
    Теперь вы можете разместить рекламную вставку на веб-сайтах. Это дешево, и
    это привлекает больше игроков.
  LABEL_MARKETING_CAMPAIGN_INTERNET_DESCRIPTION_1: >
    Теперь можно создать витрину во всемирной паутине, чтобы показать миру, что
    ваши игры существуют.
  LABEL_GAME_ONLINE_DESCRIPTION_1: >
    Сетевые администраторы повышают производительность серверов, позволяя вам поддерживать большее количество игроков с одинаковым количеством серверов.
  LABEL_CONCURRENT_STUDIOS_LIST_DESCRIPTION_0: "До сих пор вы видели своих конкурентов только на карте города. Теперь вы можете следить за ними."
  LABEL_CONCURRENT_STUDIOS_BUY_DESCRIPTION_0: >
    Покупка ваших конкурентов - это простой способ завоевать большое количество
    фанатов, а также расширить свою компанию.
  LABEL_FURNITURES_COMMON_BUY_DESCRIPTION_0: "Просматривая одну из своих студий, вы теперь можете покупать новую мебель."
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_0: "Помните, что лучшие игры создают команды, одинаково сильные в дизайне, разработке и полировке."
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_1: "Продюсеры видеоигр повышают производительность сотрудников и позволяют создавать AAA-игры."
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_2: "Специалисты отдела кадров повышают счастье сотрудников и позволяют настраивать их график работы."
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_3: >
    Привлечение бухгалтера поможет вам сэкономить на налогах.
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_4: >
    Директор студии автономно управляет разработкой и обновлениями игр.
  LABEL_STUDIO_RENT_DESCRIPTION_0: >
    Позволяет арендовать новые здания. Это позволит вам работать над несколькими
    проектами одновременно.
  LABEL_STUDIO_BUILD_DESCRIPTION_0: "Позволяет строить новые студии. Это дорого, но это один из немногих способов расти без ограничений."
  LABEL_STUDIO_BUILD_DESCRIPTION_1: "Помимо студий, вы можете строить выставочные центры, которые необходимы для организации выставок."
  LABEL_STUDIO_BUILD_DESCRIPTION_2: >
    Стройте университеты для подготовки кадров. Они достигнут совершенства!
  LABEL_CONVENTION_ORGANIZE_DESCRIPTION_0: "Если у вас есть выставочные центры, вы можете организовывать выставки."
  LABEL_CONVENTION_PARTICIPATE_DESCRIPTION_0: "Вы можете участвовать в выставках, и время от времени это будет повышать известность ваших игр."
  LABEL_STUDIO_CUSTOMIZE_DESCRIPTION_0: >
    Вы можете перекрасить стены, поменять столбы и переделать полы своих студий.
  LABEL_FURNITURES_SERVERS_BUY_DESCRIPTION_0: >
    Покупка серверов позволит вам создавать онлайн-игры, а также
    интернет-портал.
  LABEL_GAME_ONLINE_DESCRIPTION_0: >
    Вы можете создавать онлайн-игры. Обычно они дешевле, но игроки должны
    платить ежемесячную подписку.
  LABEL_DIGITAL_STORE_DESCRIPTION_0: "Вы можете создать цифровой магазин игр. Ну, точнее, первую альфа-версию, которую ещё нужно дорабатывать."
  LABEL_GAMEEDITION_SUBMIT_DESCRIPTION_0: >
    Выступайте в качестве издателя и нанимайте компании для создания вашей игры.
  LABEL_POSTMORTEM_FEATURE_DESCRIPTION_0: "Отчёт об игре рассказывает о том, что прошло хорошо или плохо во время разработки, и даёт вам подсказки."
  LABEL_NEW_GAME_FEATURE_DESCRIPTION_0: "Создание хорошей игры позволяет вам продвигаться в City Game Studio и зарабатывать деньги, фанатов и опыт."
  LABEL_TARGETTED_AUDIENCE_FEATURE_DESCRIPTION_0: "Теперь при создании игры можно выбирать целевую аудиторию. Это влияет на итоговую оценку и продажи игры."
  LABEL_CAPACITY_STORY_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала дизайна."
  LABEL_CAPACITY_USER_INTERFACE_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала дизайна."
  LABEL_CAPACITY_NETWORK_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала разработки."
  LABEL_CAPACITY_MODDING_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала разработки."
  LABEL_CAPACITY_CUTSCENES_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала полировки."
  LABEL_CAPACITY_TUTORIEL_FEATURE_DESCRIPTION_0: "При создании игры у вас появилась новая шкала полировки."
  LABEL_MARKETING_CAMPAIGN_SOCIALNETWORK_DESCRIPTION_0: >
    Вы можете размещать рекламу в социальных сетях, это очень целенаправленная,
    дорогостоящая и очень эффективная реклама.
  LABEL_MARKETING_CAMPAIGN_MAILINGLIST_DESCRIPTION_0: >
    Отправка электронных писем почти ничего вам не будет стоить и повлияет на продажи ваших игр.
  LABEL_GAMEPORT_FEATURE_DESCRIPTION_0: >
    Вы можете портировать свои игры на новые платформы.
  LABEL_UNLOCK_GAMEGENRE: "Вы набрались опыта в создании игр и чувствуете, что готовы разрабатывать новые игровые механики."
  LABEL_UNLOCK_GAMEGENRE_DESCRIPTION_0: "Теперь вы можете разблокировать новые игровые жанры. Чтобы заработать очки опыта, достаточно выпускать игры."
  LABEL_UNLOCK_GAMEGENRE_DESCRIPTION_1: "Теперь доступны контракты. Выполнение контракта приносит деньги, опыт и подсказки для определённого игрового жанра."

