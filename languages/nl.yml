  LABEL_COVID_EVENT: |
    Er is een vreemd virus opgedoken. Geïnfecteerden lijden aan hoesten en hevige koorts onder een vijftigtal verschillende symptomen.
    Het verspreidt zich met duizelingwekkende snelheid. Geconfronteerd met dit nieuwe virus nemen regeringen over de hele wereld drastische maatregelen en vragen hun burgers thuis te blijven.

    Zo opgesloten wenden mensen zich tot hun computers en spelconsoles.
    Dit heeft een positief effect op de verkoop van al je games. Er wordt een [b]verkoopstijging[/b] verwacht voor de [b]komende 24 maanden[/b].
