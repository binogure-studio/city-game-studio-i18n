  # Tutoriel labels
  TOOLTIP_SUPPORTER_DLC_REQUIRED: |
    Dit meubelstuk is hetzelfde als het origineel, maar met een andere look.
    Het heeft geen betere statistieken of andere effecten.

    Je moet de DLC «Supporter Pack» bezitten om dit meubelstuk te ontgrendelen.
  TOOLTIP_BONUS_HYPE: "Bonushype ontstaat wanneer je je game op beurzen laat zien."
  TOOLTIP_CUSTOM_PLATFORM_RELEASE: |
    Gefeliciteerd, je hebt net je console ontwikkeld!

    Voordat je de console publiceert, is het belangrijk om een behoorlijke catalogus met games op te bouwen.
    Overweeg hiervoor exclusieve contracten te sluiten met je concurrenten.
    Je kunt ook zelf een aantal kleine games uitbrengen.
    Je kunt natuurlijk ook als uitgever optreden en kleine onafhankelijke studio's inhuren om spellen voor je te maken.

    Al met al is het het beste om ten minste 15 spellen te hebben voordat je je eerste console uitbrengt.
  TOOLTIP_UNIVERSITY_TRAINING: |
    Met universiteiten kun je je werknemers verder opleiden dan hun normale capaciteiten.
    Door je werknemers verder op te leiden dan hun normale capaciteiten, stijgt hun salaris echter aanzienlijk.
  TOOLTIP_GAME_GENRE_MAX_2_GENRES: |
    Maximaal 2 genres per spel.

    Sommige spelgenres zijn al combinaties van genres,
    en daarom kun je ze niet combineren met andere spelgenres.
  TOOLTIP_GAME_GENRE_LOCKED: |
    Dit genre is voorlopig vergrendeld.
  TOOLTIP_GAME_TYPE_SELECT_ONE: |
    Je moet minstens één spelgenre selecteren om een spel te maken.
  TOOLTIP_RANDOM_SLIDER: "Bij het maken van een game worden de verwachte waarden van de meters in de ontwikkelings-, ontwerp- en afwerkingsfase willekeurig."
  TOOLTIP_REQUIRE_GAME: "Je moet %s bezitten om dit item te ontgrendelen."
  TOOLTIP_RELATIONSHIP: |
    Met een goede relatie kun je betere aanbiedingen krijgen.
    Een slechte relatie leidt daarentegen tot moeilijkere onderhandelingen.

    Relaties verbeteren wanneer je games uitgeeft op hun console.
    Of wanneer je exclusieve contracten accepteert of een licentie koopt.

    Relaties verslechteren wanneer je een exclusief contract weigert,
    of wanneer je onderhandelingen begint zonder een licentie te kopen.
  TOOLTIP_EMPLOYEE_BETTER_STUDIO_FURNISHING: "Voeg automaten, planten of koffiemachines toe om hun werkplek te verbeteren."
  TOOLTIP_EMPLOYEE_BORED_GENRE: |
    Je werknemer wil een nieuw gamegenre uitproberen. Je werknemer wil niet 
    werken aan gamegenres zoals:
  TOOLTIP_GAME_ENGINE_WHY: |
    Maak je eigen game-engine.

    Als je een propriëtaire engine maakt, kun je die met een licentie verkopen.
    Of maak hem royaltyvrij en laat een community je game-engine verbeteren.
    Of houd hem intern zodat concurrenten er geen voordeel uit halen.
  TOOLTIP_TRADE_PUBLISH_WHY: |
    Maak games voor concurrenten.

    Je krijgt snel veel nieuwe fans.
    Aan de andere kant groeien je concurrenten nog sneller.
  TOOLTIP_PUBLISH_GAME_WHY: |
    Word game-uitgever.

    Dit is goedkoper dan zelf een game ontwikkelen, en het levert veel geld op.
    Je krijgt er echter geen fans bij.
  TOOLTIP_REMAKE_MISSING_FEATURE_NO_ALTERNATIVE: |
    Deze functie is niet beschikbaar,
    hoewel ze in de originele game zat.
  TOOLTIP_REMAKE_MISSING_FEATURE_ALTERNATIVE: |
    Deze functie is niet beschikbaar,
    maar er is een alternatief beschikbaar,
    het is aanbevolen om dat te gebruiken.
  TOOLTIP_REMAKE_CAPACITIES_NOT_ENOUGH: |
    Deze remake maakt geen gebruik van de
    mogelijkheden van de console.
  TOOLTIP_REMAKE_ENGINE_FEATURE_NOT_VALID: |
    Sommige functies worden niet ondersteund,
    kies andere.
  TOOLTIP_POSTMORTEM_ALREADY_DONE: "Het spelrapport is al gemaakt."
  TOOLTIP_POSTMORTEM_AUTOMATICALLY: "Het spelrapport automatisch maken."
  TUTORIEL_CREATE_GAME: |
    Klik op deze knop om het paneel voor het maken van spellen te openen.
  TUTORIEL_GAME_ENGINE_TOO_EXPENSIVE: |
    De kosten om deze game-engine te upgraden zijn hoger.
    De game-engine veroudert namelijk, dus de ontwikkelingskosten kunnen de pan uit rijzen.

    Je kunt beter een nieuwe maken in plaats van deze te updaten, zodat je niet met zo'n boete te maken krijgt.
    Of je kunt de verouderde code herschrijven, wat goedkoper is dan een nieuwe engine maken.
  TUTORIEL_PLATFORM_MAKING_COSTS: |
    Let op: de productiekosten van de console zijn hoger dan de prijs.
    Als de verkoop sterk stijgt, kan het bedrijf failliet gaan.

    Verhoog daarom de prijs van de console om geen geld te verliezen.
  TUTORIEL_CREATE_GAME_OBSOLETE: |
    Andere uitgevers slagen er niet in hun games op deze console te verkopen.
    Waarschijnlijk zul ook jij niet genoeg exemplaren van je game op deze console verkopen.

    Je kunt beter een andere console kiezen, anders word je misschien teleurgesteld.
  TUTORIEL_CREATE_NORMAL_GAME: |
    Omdat je niet genoeg fans hebt om games van deze grootte te verkopen,
    heb je een score van meer dan 90% nodig om succes te hebben.

    Misschien kun je de game iets kleiner maken zodat hij beter verkoopt.
    Om je aantal fans te laten groeien, kun je ook uitgeversaanbiedingen van andere bedrijven aannemen.
  LABEL_ORDER_BY_NAME_ONLY: Alleen op naam
  LABEL_ORDER_BY_NAME_AND_ACTIVITY: Op naam en activiteit

  # Tooltips
  TOOLTIP_SORT_STUDIO_LIST: |
    Sorteer de studiolijst
  TOOLTIP_TIPS_CAPACITY: |
    Je krijgt meer tips door contracten uit te voeren of spelrapporten te maken.
    Meer tips betekent een nauwkeurigere blauwe meter.
  TOOLTIP_CANCEL_EXCLUSIVE_GAME: |
    Je hebt een exclusief aanbod getekend.
    Deze game kan niet naar een andere console worden geport en moet minstens één jaar in de winkel blijven liggen.
    Na deze periode mag je het contract annuleren.
  TOOLTIP_KEEP_HINT: |
    Als je dit vakje aanvinkt, behoud je alle kennis die je hebt verzameld met de
    spelrapporten van je vorige saves.
  TOOLTIP_CONCURRENT_PAY_TO: "Omdat de game %s niet aan de verwachtingen van %s voldeed, moet je een boete van %s$ betalen. Aangezien je maar %s$ hebt, kun je beter een lening afsluiten om een faillissement te vermijden."
  TOOLTIP_ROYALTY_GET: "Dit is het percentage dat je ontvangt van de gegenereerde inkomsten."
  TOOLTIP_ROYALTY_GIVE: "Dit is het percentage dat je betaalt over de gegenereerde inkomsten."
  TOOLTIP_SERVER_BURNING: |
    Let op: de servers kunnen zoveel spelers niet aan.

    Klanten die de game hebben gekocht, tellen mee als verkoop, maar worden meteen terugbetaald omdat ze niet kunnen inloggen.
    Dit is een enorm verlies aan inkomsten.

    Het is tijd om de servercapaciteit te verhogen.
  TOOLTIP_FIRST_CUSTOM_CONSOLE: |
    Gefeliciteerd, je bent begonnen aan je eerste console.

    Voor een goede start heb je een grote gamecatalogus nodig.
    Door devkits rond te sturen, moedig je je concurrenten aan om games voor
    je console te maken.

    Klik op die knop om devkits te versturen.
  TOOLTIP_GAME_PRICE_TAG: |
    Schakel tussen een betaalde en een free-to-play game.

    Voor een gratis game moet je ofwel een online game
    maken met een maandelijks abonnement, ofwel de reclame-
    of microtransactiemodules activeren.
  TOOLTIP_TRADE_DELAY_BETWEEN_ORDER_EXECUTION: |
    Verzamelt koop- en verkooporders die gedurende
    dit tijdsbestek zijn uitgegeven.
  TOOLTIP_TRADE_CHART: |
    De werking is eenvoudig, elke kaars kan rood of blauw zijn,
    rood als de koers van een aandeel is gedaald, blauw als de
    koers is gestegen ten opzichte van het begin van dezelfde
    kaars. De rechthoek is het lichaam van de kaars, het
    vertegenwoordigt de variatie van de opening tot de sluiting
    en een dunne lijn die het kruist geeft het maximum en
    minimum aan. 
  TOOLTIP_GAME_SIZE: |
    De grootte van het spel heeft gevolgen voor het aantal vereiste punten,
    de tijd die nodig is om het spel te ontwikkelen en de productiekosten.

    Het is moeilijker om een score van meer dan 90 te halen met een klein spel dan met een groot spel.
  TOOLTIP_THEME_TREND: "Thematrends beïnvloeden de verkoop."
  TOOLTIP_HAPPY_EMPLOYEE: "Je werknemer is gelukkig."
  TOOLTIP_EMPLOYEE_HAPPINESS: |
    Hoe gelukkiger een werknemer is, hoe minder vaak hij op vakantie zal gaan.
    Hoe ongelukkiger een werknemer is, hoe vaker hij op vakantie zal gaan.
  TOOLTIP_EMPLOYEE_PRODUCTIVITY: |
    Hoe hoger de productiviteit van werknemers, hoe meer punten zij zullen produceren.
  TOOLTIP_GAME_PRICE: |
    Hoe hoger de prijs van een spel, hoe hoger de winst.
    Maar het verlagen van de prijs van een spel helpt om meer fans te krijgen.
  TOOLTIP_TOO_HARD: |
    Deze moeilijkheidsgraad is uitdagend.
    Het is beter om de game eerst op moeilijkheidsgraad 1 of 2 uit te spelen.

    Als je een te moeilijke modus probeert, kan het zijn dat je de game niet leuk vindt of het gevoel krijgt dat iets oneerlijk of onevenwichtig is.
  TOOLTIP_REQUIRED_POINTS: |
    Aantal punten dat nodig is om een goede game te maken.

    Hoe groter de game, hoe meer punten nodig zijn.
    Het houdt ook rekening met vergelijkbare games uit de laatste 4 jaar.
  TOOLTIP_NO_MONEY: |
    Het is tijd om verstandiger te worden.

    Met andere woorden: je moet bezuinigen op je uitgaven om te overleven.
    Op dit moment moet het bedrijf gered worden.

    Je beste optie is een lening af te sluiten die zo groot en zo lang mogelijk is.
  TOOLTIP_GAME_UPDATE_BUTTON: "Klik om je games bij te werken, DLC te maken of financiële details te bekijken"
  TOOLTIP_GAMECREATION_HELP: >
    Toont de spellen van hetzelfde genre die je hebt gemaakt. Handig om de meters af te stellen.
  TOOLTIP_GAMEENGINE_CREATE: "Kies welke functies je in je game-engine wilt stoppen"
  TOOLTIP_TIRED_GAME_GENRE: "Je werknemers willen graag nieuwe gamegenres uitproberen, ze zijn het beu om steeds dezelfde gamegenres te maken:"
  TOOLTIP_MARKETSEARCH_SELECT_PLATFORM_OR_THEME: |
    Selecteer de te analyseren thema's/platforms
  TOOLTIP_MARKETSEARCH_SELECT_GENRE: "Selecteer het gamegenre dat je wilt bestuderen"
