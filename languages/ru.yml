  LABEL_COVID_EVENT: |
    Появился странный вирус. Заражённые страдают от кашля и сильной лихорадки среди примерно пятидесяти различных симптомов.
    Он распространяется с головокружительной скоростью. Столкнувшись с этим новым вирусом, правительства по всему миру принимают решительные меры и призывают своих граждан оставаться дома.

    Находясь взаперти, люди обращаются к своим компьютерам и игровым консолям.
    Это положительно влияет на продажи всех ваших игр. Ожидается [b]рост продаж[/b] в течение [b]следующих 24 месяцев[/b].
