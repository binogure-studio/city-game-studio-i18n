  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_TITLE: 素晴らしいアップデート!
  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_DESCRIPTION: |
    ファンの期待に応えてくれたことに拍手です。

    あなたのファンは、このアップデートに大喜びです！
    彼らは口コミで広め、[b]%s[/b]の周りの熱狂を増幅させ、それが売り上げに影響しそうです。

    素晴らしい仕事だ、誇りに思っていい。
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_TITLE: 遅すぎる・・・。
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_DESCRIPTION: |
    [b]%s[/b]は数ヶ月前にリリースされました。
    このゲームの勢いは衰え、その間に他の似たようなゲームが発売されました。

    この機会は逃してしまいましたが、次は逃さないようにしましょう。
  LABEL_EVENT_GAME_SEQUEL_ASK_TITLE: 続編はいつですか？
  LABEL_EVENT_GAME_SEQUEL_ASK_DESCRIPTION: |
    [b]%s[/b]さんへ

    友達と一緒に[b]%s[/b]をプレイするのが大好きです！
    もう[b]%s[/b]年以上プレイしていて、続編を作ってほしいと思っています！

    このゲームが大好きで、これからも何年も遊び続けるつもりです！
    でも、今続編を作ってくれたら、買って友達にも広めます！

    だから、お願いします、続編を作ってください！
    あなたたちには才能があるから、がっかりすることはないはず！

    セラープレイヤー
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_TITLE: 続編！？
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_DESCRIPTION: |
    文字通り、がっかりした気分です。[b]%s[/b]を大勢の友人とプレイしましたが、オリジナルとは全く違いました!

    まあ、それでも買って最後までクリアしましたが、もっとクオリティの高いゲームにしてほしかった。

    セラープレイヤー
  LABEL_EVENT_GAME_SEQUEL_GET_OK_TITLE: "%sは最高！"
  LABEL_EVENT_GAME_SEQUEL_GET_OK_DESCRIPTION: |
    まさに私たちが望んでいたもの! 素晴らしい続編です!
    友人とも話していたのですが、これからたくさん遊びたいと感じています。

    [b]%s[/b]は期待に応えてくれて、率直に言って、ありがとうございます!

    セラープレイヤー
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_TITLE: 信じられない！！
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_DESCRIPTION: |
    [b]%s[/b]は息を呑むほど素晴らしい!

    グラフィック、ゲームプレイ、音楽、すべてが完璧です。
    あなたは、ゲーム作りの芸術の巨匠になりましたね。

    この続編には誰もが満足しています。実際、私は親しい友人や家族にプレゼントするために10回購入しました。

    あなた方は最高です!
    本当にありがとうございました。

    セラープレイヤー
  LABEL_EVENT_GAME_THEME_TRENDING_TITLE: "%sが流行中"
  LABEL_EVENT_GAME_THEME_TRENDING_DESCRIPTION: |
    [b]%s[/b]さん、こんにちは。

    [b]%s[/b]のリリースは、まさに今のトレンドの突破口と言えるでしょう。
    彼らは、もっと、もっと、もっとと望んでいます。彼らは「[b]%s[/b]」のゲームを切実に欲しているのです。

    これは新しいトレンドで、長くは続きません。早めに活用したほうがいいでしょう。
