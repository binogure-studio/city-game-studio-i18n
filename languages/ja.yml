  LABEL_GAME_UPDATE_FEATURE: >
    ゲームのアップデートを公開し、新しいコンテンツを作成します。無料のアップデートか、有料DLCか。それはあなた次第です。
  LABEL_GAMEEDITION_SUBMIT: >
    あなたにはたくさんのファンがおり、
    ゲームをパブリッシングできるほどの知名度があります。
  LABEL_GAMEEDITION_RECEIVE: >
    最近の成功を受けて、パブリッシャーからすぐにオファーが来るようになりました。
  LABEL_WORLDMAP: >
    顔を上げれば、そこには世界が待っている。
  LABEL_MARKETING_CAMPAIGN_MAGAZINE: >
    ゲーム雑誌が続々と創刊されています、自分のゲームを宣伝してみませんか?
  LABEL_MARKETING_CAMPAIGN_TV: >
    テレビ広告で自分のゲームをアピールする時期です。
  LABEL_MARKETING_CAMPAIGN_INTERNET: >
    インターネットの時代が始まり、簡単なバナー広告で何百万人もの人にリーチできるようになりました。
  LABEL_CONCURRENT_STUDIOS_LIST: >
    スタジオが成長しています。市場を研究し、競合他社をのぞいてみる時です。
  LABEL_CONCURRENT_STUDIOS_BUY: >
    儲かっていますし、そろそろライバルのスタジオを買ってもよいのではないでしょうか?
  LABEL_FURNITURES_COMMON_BUY: >
    今こそ、スタイリッシュなオフィスに模様替えをしましょう。
  LABEL_EMPLOYEES_HIRE: >
    あなたのスタジオは成長し、より多くのゲームを生産し、その品質を向上させています。しかしまずは人材を確保するべきでしょう。
  LABEL_STUDIO_RENT: >
    小さなスタジオが手狭になってきました。次の拠点を探しましょう。
  LABEL_STUDIO_BUILD: >
    成功したおかげで、自分のスタジオを建設できるようになりました。
  LABEL_CONVENTION_ORGANIZE: >
    10万人の支援者があれば、自分でコンベンションを開催することができます。
  LABEL_CONVENTION_PARTICIPATE: >
    あなたのゲームカタログは見てもらう価値があります。コンベンションに参加することで知名度を上げることができるかもしれません。
  LABEL_STUDIO_CUSTOMIZE: >
    殺風景な壁が生産性を低下させていませんか?
    デザインを変えてみるとよいかもしれません。
  LABEL_GAME_ONLINE: >
    プレイヤーを画面に釘付けにするには?
    インターネットです。オンラインゲームを作れば、彼らは夢中になるでしょう
  LABEL_FURNITURES_SERVERS_BUY: >
    机を増やし、椅子を増やし、コンピューターを増やし、ホワイトボードを増やし、もっともっと増やしましょう。
  LABEL_DIGITAL_STORE: >
    デジタル配信？耳にし始めたばかりですが、それが未来だということはもうわかっています。
  LABEL_POSTMORTEM_FEATURE: >
    おめでとうございます、あなたは最初のゲームを作りました。これで、開発、デザイン、仕上げを評価するためのポストモーテムに進むことができます。
  LABEL_NEW_GAME_FEATURE: >
    ビデオゲームの壮大な歴史を、その始まりから追体験してみませんか?
    City Game Studio へようこそ。あなたの初めてのゲームを作りましょう。
  LABEL_LOADING: ロード中
  LABEL_NAME: 名前
  LABEL_SALARY: 給料
  LABEL_NO_SCORE: まだスコアはアップロードされていません!
  LABEL_CAPACITY_STORY_FEATURE: |
    良いゲームはいつだって良い。良いストーリーもいつだって良い。では、良いストーリーを持つ良いゲームは？
  LABEL_CAPACITY_USER_INTERFACE_FEATURE: >
    そのボタンは何のため？
    ゲームのユーザーインターフェースを管理する必要があります。
  LABEL_CAPACITY_NETWORK_FEATURE: >
    ビデオゲームをプレイするのは素晴らしいことですが、友達と一緒にプレイするのはもっと素晴らしいことです!
    ゲームのためにネットワークを管理する必要があります。
  LABEL_CAPACITY_MODDING_FEATURE: |
    あなたのゲームの中には、すでにプレイヤーによって改造されたものがあります。そのおかげでゲームの売上が伸びています。今こそそうしたハッカーたちを助け、本格的なMOD APIに取り組む時です。
  LABEL_CAPACITY_CUTSCENES_FEATURE: >
    映画はビデオゲームに影響を与えます。新しいゲームを開発する際にはカットシーンにも気を配らなければなりません。
  LABEL_CAPACITY_TUTORIEL_FEATURE: >
    新しいゲームを遊べるようになるには、まず操作方法や仕組みを覚える必要があります。
    これは簡単ではありません。そのため新しいゲームのチュートリアルを作ることにしました。
  LABEL_MARKETING_CAMPAIGN_SOCIALNETWORK: >
    Rick と Paris が彼らのプライベートな生活を世界に発信しています。
    ソーシャルネットワークはますます普及しており、ゲームの販売に利用することができます。
  LABEL_MARKETING_CAMPAIGN_MAILINGLIST: >
    最近の研究では、迷惑メールを送信するとゲームの認知度が大幅に向上することがわかっています。
    「スパム」は新たな流行語で、ゲームの宣伝に活用できます！
  LABEL_GAMEPORT_FEATURE: >
    夢がかないます。新しいゲーム機が発売されました!
    クロスプラットフォームのゲームをリリースすることができます。
    さあ、試してみましょう!
  LABEL_GAME_CREATION: 各ゲージを調整することで、ゲームの各部分の作業量を推定することができます。
  LABEL_GAMEEDITION_RECEIVE_DESCRIPTION_0: |
    パブリッシャーからのオファーを確認できます。パブリッシャーを通じてゲームを発売することは、人気を得て、より大きなゲームを作るための簡単な方法です。
  LABEL_WORLDMAP_DESCRIPTION_0: >
    街を訪れ、競合他社を見て、自分のスタジオがどこにあるのかを確認しましょう。
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_0: >
    多くのゲーム雑誌を利用したマーケティングキャンペーンを行うことができます。これにより、ゲームの認知度が高まります。
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_1: >
    販売中のゲームのポスターを貼ることができる広告板をレンタルすることができます。
  LABEL_MARKETING_CAMPAIGN_MAGAZINE_DESCRIPTION_2: >
    マーケティングマネージャーを雇えるようになりました。あなたのマーケティングキャンペーンを後押ししてくれます。
  LABEL_MARKETING_CAMPAIGN_TV_DESCRIPTION_0: >
    テレビ広告キャンペーンを実施できます。お金はかかりますが、近年テレビを見ない人なんていないでしょう。
  LABEL_MARKETING_CAMPAIGN_INTERNET_DESCRIPTION_0: >
    Webサイトに広告インサートを表示できるようになりました。安価で、プレイヤーも増えます。
  LABEL_MARKETING_CAMPAIGN_INTERNET_DESCRIPTION_1: >
    ウェブ上にショーケースを作り、自分のゲームを世界にアピールすることができるようになりました。
  LABEL_GAME_ONLINE_DESCRIPTION_1: >
    ネットワーク管理者はサーバーの能力を向上させ、同じ数のサーバーでより多くのプレイヤーをサポートできるようにします。
  LABEL_CONCURRENT_STUDIOS_LIST_DESCRIPTION_0: >
    これまでは都市マップ上で競合他社を見ることしかできませんでしたが、これからは彼らの動向をチェックできます。
  LABEL_CONCURRENT_STUDIOS_BUY_DESCRIPTION_0: >
    ライバル会社を買収することは、多くのファンを獲得するだけでなく会社を拡大するための簡単な方法です。
  LABEL_FURNITURES_COMMON_BUY_DESCRIPTION_0: >
    スタジオの一つを見ている間に、新しい家具を買うことができるようになりました。
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_0: >
    最高のゲームは、デザイン、開発、仕上げのすべてに等しく強いチームによって生み出されることを覚えておいてください。
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_1: >
    ビデオゲームプロデューサーは、従業員の生産性を高め、AAAクラスのゲームを作れるようにします。
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_2: >
    人事部は従業員の幸福度を高め、従業員のスケジュールをカスタマイズできるようにします。
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_3: >
    会計士を雇えば、税金の節約にもなります。
  LABEL_EMPLOYEES_HIRE_DESCRIPTION_4: >
    スタジオディレクターは、ゲームの開発と更新を自律的に管理します。
  LABEL_STUDIO_RENT_DESCRIPTION_0: >
    新しい建物のレンタルを可能にします。これにより、複数のプロジェクトを同時に進めることができるようになります。
  LABEL_STUDIO_BUILD_DESCRIPTION_0: >
    新しいスタジオを作ることができます。お金はかかりますが、無制限に成長し続けるための数少ない方法の一つです。
  LABEL_STUDIO_BUILD_DESCRIPTION_1: >
    スタジオを作れるだけでなく、コンベンションの開催に必要な展示センターも作ることができます。
  LABEL_STUDIO_BUILD_DESCRIPTION_2: >
    従業員を育成するために大学を建設しましょう。彼らは完璧に到達するでしょう！
  LABEL_CONVENTION_ORGANIZE_DESCRIPTION_0: >
    展示センターがあれば、コンベンションを開催できます。
  LABEL_CONVENTION_PARTICIPATE_DESCRIPTION_0: >
    コンベンションに参加すれば、時々ゲームの知名度を上げることができます。
  LABEL_STUDIO_CUSTOMIZE_DESCRIPTION_0: >
    スタジオの壁を塗り替えたり、柱を変えたり、床を敷き直したりすることができます。
  LABEL_FURNITURES_SERVERS_BUY_DESCRIPTION_0: >
    サーバーを購入すれば、オンラインゲームだけでなく、オンラインポータルも作ることができます。
  LABEL_GAME_ONLINE_DESCRIPTION_0: >
    オンラインゲームを作ることができます。通常は安価ですが、プレイヤーは月額利用料を支払う必要があります。
  LABEL_DIGITAL_STORE_DESCRIPTION_0: >
    デジタルゲームストアを作ることができます。とはいえ、まだ改善が必要な最初のアルファ版ですが。
  LABEL_GAMEEDITION_SUBMIT_DESCRIPTION_0: >
    パブリッシャーとして、ゲームを作る会社を雇えます。
  LABEL_POSTMORTEM_FEATURE_DESCRIPTION_0: >
    ポストモーテムとは、ゲームの開発中に何が良かったか、何が悪かったかを報告するもので、開発のヒントを与えてくれます。
  LABEL_NEW_GAME_FEATURE_DESCRIPTION_0: >
    良いゲームを作ることで City Game Studio での活動が捗り、お金やファン、経験を得ることができます。
  LABEL_TARGETTED_AUDIENCE_FEATURE_DESCRIPTION_0: >
    ゲームを制作する際に、ターゲット層を選べるようになりました。これがゲームの最終的なスコアや売り上げに影響してきます。
  LABEL_CAPACITY_STORY_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しいデザインゲージが追加されました。
  LABEL_CAPACITY_USER_INTERFACE_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しいデザインゲージが追加されました。
  LABEL_CAPACITY_NETWORK_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しい開発ゲージが追加されました。
  LABEL_CAPACITY_MODDING_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しい開発ゲージが追加されました。
  LABEL_CAPACITY_CUTSCENES_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しい仕上げゲージが追加されました。
  LABEL_CAPACITY_TUTORIEL_FEATURE_DESCRIPTION_0: >
    ゲーム制作時に新しい仕上げゲージが追加されました。
  LABEL_MARKETING_CAMPAIGN_SOCIALNETWORK_DESCRIPTION_0: >
    ソーシャルネットワーク上で広告を出すことができますが、とてもターゲットが絞られています。費用もかかりますが、非常に効果的です。
  LABEL_MARKETING_CAMPAIGN_MAILINGLIST_DESCRIPTION_0: >
    メールの送信にはほとんどコストがかかりませんし、ゲームの売り上げにも影響します。
  LABEL_GAMEPORT_FEATURE_DESCRIPTION_0: >
    あなたのゲームを新しいプラットフォームに移植することができます。
  LABEL_UNLOCK_GAMEGENRE: ゲーム制作の経験を積み、新しいゲームメカニクスを開発する準備ができました。
  LABEL_UNLOCK_GAMEGENRE_DESCRIPTION_0: >
    新しいジャンルのゲームをアンロックできるようになりました。経験値を獲得するには、ゲームを公開するだけです。
  LABEL_UNLOCK_GAMEGENRE_DESCRIPTION_1: >
    契約が可能になりました。契約を完了すると、特定のゲームジャンルでお金や経験値、ヒントが得られます。

