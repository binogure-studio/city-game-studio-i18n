  # Labels, descriptive
  LABEL_THEME_INTERFACE: Тема интерфейса
  LABEL_LIGHT_THEME: Светлая тема
  LABEL_DARK_THEME: Тёмная тема
  LABEL_SOLARI_THEME: Тема Solari
  LABEL_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: Минимальное счастье
  TOOLTIP_MINIMUM_HAPPINESS_BEFORE_HOLIDAY: |
    Автоматически отправляет сотрудника в отпуск, когда его счастье опускается ниже установленного предела.

    Когда сотрудник несчастлив, он работает хуже и чаще уходит в отпуск. Чтобы сотрудники были более продуктивными,
    лучше отправлять их в отпуск до того, как они станут слишком несчастны.
  TOOLTIP_STUDIO_DIRECTOR_SEQUEL: |
    Выберите стратегию продолжений директора:

    • Без продолжений: сосредоточен исключительно на создании новых игр
    • Только свои игры: создаёт продолжения только для игр, которые разработал
    • Все игры: создаёт продолжения для всего доступного каталога

    После завершения директор возобновляет разработку новых проектов.
