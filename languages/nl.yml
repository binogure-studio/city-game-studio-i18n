  LABEL_BACKWARD_COMPATIBILITY: Achterwaartse compatibiliteit
  TOOLTIP_BACKWARD_COMPATIBILITY: |
    Om een achterwaarts compatibele console te maken, is het noodzakelijk dat je al een console van dezelfde soort hebt gemaakt.
    Als je dus een handheld console maakt en je wilt hem achterwaarts compatibel maken,
    dan heb je een handheld console nodig die je al eerder hebt gemaakt.
    Hij is achterwaarts compatibel met de laatste console van dezelfde soort die je hebt ontworpen.

    Achterwaarts compatibel zijn maakt het sneller en beter om spellen van de vorige console over te zetten.
    Aan de andere kant vergt het veel ontwikkelingspunten om de huidige console te realiseren.

    Het is niet mogelijk om een console achterwaarts compatibel te maken als je nog niet eerder een console van dezelfde soort hebt uitgebracht.
  LABEL_EVENT_GAME_NEEDS_UPDATE_ASK_TITLE: Update alsjeblieft!
  LABEL_EVENT_GAME_NEEDS_UPDATE_ASK_DESCRIPTION: |
    Hoi [b]%s[/b],

    We hebben een kleine gemeenschap opgebouwd rond [b]%s[/b].
    Zij delen tips en volgen het nieuws van je bedrijf, en wachten met spanning op nieuws van [b]%s[/b].

    Als je in de komende [b]%d maanden[/b] een update publiceert, zullen ze blij zijn!
  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_TITLE: Geweldige update!
  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_DESCRIPTION: |
    Petje af dat je de verwachtingen van je fans hebt waargemaakt.

    Je fans zijn enthousiast over deze update!
    Ze vertellen het overal rond, waardoor het enthousiasme rond [b]%s[/b] wordt versterkt, wat zijn weerslag zal hebben op de verkoop.

    Geweldig gedaan, je mag trots zijn op jezelf.
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_TITLE: Het is te laat...
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_DESCRIPTION: |
    [b]%s[/b] werd enkele maanden geleden uitgebracht.
    Het momentum rond het spel is afgenomen, andere soortgelijke spellen zijn inmiddels uitgebracht.

    Je hebt deze kans gemist, mis de volgende niet.
  LABEL_EVENT_GAME_SEQUEL_ASK_TITLE: Wanneer komt het vervolg?
  LABEL_EVENT_GAME_SEQUEL_ASK_DESCRIPTION: |
    Meneer [b]%s[/b],

    Met mijn vrienden spelen we graag [b]%s[/b]!
    We spelen het nu al meer dan [b]%s[/b] jaar, en we zouden graag zien dat jullie een vervolg maken!

    We houden absoluut van dit spel, en zullen het nog jaren spelen!
    Maar als jullie nu een vervolg maken, zullen we het kopen en onze vrienden erover vertellen!
        
    Dus, alsjeblieft, maak een vervolg!
    Jullie zijn zo getalenteerd, we kunnen niet teleurgesteld worden!

    De Kelderspeler
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_TITLE: Een vervolg?!
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_DESCRIPTION: |
    Ik voel me teleurgesteld, letterlijk. Al mijn vrienden en ik hebben [b]%s[/b] gespeeld en het lijkt in niets op het origineel!

    Nou, we hebben het nog steeds gekocht, en we hebben het nog steeds uitgespeeld, maar we hadden graag een spel van betere kwaliteit gezien...

    De Kelderspeler
  LABEL_EVENT_GAME_SEQUEL_GET_OK_TITLE: "%s is geweldig!"
  LABEL_EVENT_GAME_SEQUEL_GET_OK_DESCRIPTION: |
    Precies wat we altijd al wilden! Het is een fantastisch vervolg!
    We hadden het erover met mijn vrienden, en ik heb het gevoel dat we het veel gaan spelen.

    [b]%s[/b] voldoet aan onze verwachtingen, en eerlijk gezegd, heel erg bedankt!

    De Kelderspeler
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_TITLE: ONGELOOFLIJK!!
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_DESCRIPTION: |
    [b]%s[/b] is adembenemend!

    Graphics, gameplay, muziek, alles is zo perfect.
    Jullie zijn meesters geworden in de kunst van het spellen maken!

    Iedereen is zo blij met dit vervolg, in feite heb ik het 10 keer gekocht om het aan al mijn goede vrienden en familie cadeau te doen!

    Jullie zijn de beste!
    Heel erg bedankt!

    De Kelderspeler
