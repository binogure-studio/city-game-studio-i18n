  TOOLTIP_GAME_OF_THE_YEAR: |
    Каждый год новая игра получает звание «Игра года».
  TOOLTIP_DESK_REPLACE: |
    Заменить столы и обновить компьютеры
  TOOLTIP_POSTMORTEM_RED_ZONE: |
    Отчеты об играх помогли вам уточнить синюю зону.
    Выйдя из синей зоны, вы рискуете сделать несбалансированную игру и получить плохие отзывы.
  LOADING_SCREEN_TIP_0: >
    Вашу компанию тайно оценивают по качеству игр, выпущенных вами за последние четыре года.
  LOADING_SCREEN_TIP_1: >
    Идеальные сотрудники могут сами откликнуться на вакансию и усилить ваши команды разработки.
  LOADING_SCREEN_TIP_2: "Этот экран загрузки нужен только для того, чтобы заставить вас ждать, на самом деле это зацикленный sleep(random(0, 50))."
  LOADING_SCREEN_TIP_3: >
    Открытие для себя нового игрового жанра дает вам значительное преимущество
    перед конкурентами.
  LOADING_SCREEN_TIP_4: |
    Создание игр с конкурентами - лучший способ стать знаменитым.
  LOADING_SCREEN_TIP_5: >
    Вы можете организовывать выставки в своих собственных зданиях, но лучше проводить их с интервалом в год.
  LOADING_SCREEN_TIP_6: |
    Отдел плохих продаж всегда прав.
  LOADING_SCREEN_TIP_7: >
    Вам нужны серверы для размещения онлайн-игр, сами игры дешевле, но игроки должны платить ежемесячно, чтобы продолжать в них играть.
  LOADING_SCREEN_TIP_8: |
    Эйнштейн, наш талисман, лаял 65,13 раз во время разработки City Game Studio.
  LOADING_SCREEN_TIP_9: >
    Во время разработки City Game Studio прозвучало 12 654 рождественские песни.
  LOADING_SCREEN_TIP_10: >
    Хорошо смотреть на долю рынка, но вы также должны позаботиться о количестве игр, опубликованных на платформе.
  LOADING_SCREEN_TIP_11: "Хотите помочь с переводом City Game Studio? Присоединяйтесь к нашему Discord: https://discord.gg/citygamestudio"
  LOADING_SCREEN_TIP_12: >
    Когда индикаторы ваших серверов горят красным, это означает, что они перегружены.
  LOADING_SCREEN_TIP_13: |
    Не забудьте сделать перерыв на кофе... Ах да, кофемашина опять сломалась.
  LOADING_SCREEN_TIP_14: >
    Кранчтайм - это не марка хлопьев, а широко распространённая управленческая практика.
  LOADING_SCREEN_TIP_15: |
    Выпуск новой игры - лучший способ заработать деньги.
  LOADING_SCREEN_TIP_16: "Отчёты об играх позволяют узнать больше о выпущенных вами играх."
  LOADING_SCREEN_TIP_17: >
    Согласно недавнему исследованию, почти 1 из 625,3 собаки лает, когда идёт дождь, а остальные над ней смеются.
  LOADING_SCREEN_TIP_18: |
    Не полагайтесь на все, что вы можете прочитать на экранах загрузки.
  LOADING_SCREEN_TIP_19: >
    Если приютить кошку, ваши студии получат небольшой бонус.
  LOADING_SCREEN_TIP_20: >
    Если ваша студия имеет неравномерный уровень мастерства, это может повлиять на общее качество игры.
  LOADING_SCREEN_TIP_21: >
    Нажмите F1, чтобы открыть внутриигровую консоль.

