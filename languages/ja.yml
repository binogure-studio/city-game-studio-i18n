  # Tutoriel labels
  TOOLTIP_SUPPORTER_DLC_REQUIRED: |
    この家具は、見た目が異なるだけで元の家具と同じです。
    より良いステータスや異なる効果はありません。

    この家具のロックを解除するには、DLC「Supporter Pack」を所有している必要があります。
  TOOLTIP_BONUS_HYPE: |
    コンベンションでゲームを披露すると、ボーナスの期待度が生まれます。
  TOOLTIP_CUSTOM_PLATFORM_RELEASE: |
    おめでとうございます。ついにゲーム機が完成しました！

    発売前に、ゲームのカタログを充実させることが重要です。
    そのためには、競合他社と独占契約を結ぶことを検討しましょう。あるいは、
    自分で小さなゲームをいくつかリリースするのもよいでしょう。もちろん、
    パブリッシャーとして小規模なインディースタジオを雇い、ゲームを作ってもらうという選択肢もあります。

    総合的に考えると、最初のゲーム機を発売する前に、
    少なくとも15本のゲームを用意しておくのがベストです。
  TOOLTIP_UNIVERSITY_TRAINING: |
    大学では、従業員の通常の能力を超えたトレーニングを行うことができます。
    しかし、通常の能力を超えて従業員を訓練することは、従業員の給与を大幅に引き上げることになります。
  TOOLTIP_GAME_GENRE_MAX_2_GENRES: |
    1ゲームにつき最大2ジャンルまでとします。

    ゲームジャンルの中には、すでにジャンルの組み合わせになっているものがあるため、他のゲームジャンルと組み合わせることはできません。
  TOOLTIP_GAME_GENRE_LOCKED: |
    このジャンルは今のところロックされています。
  TOOLTIP_GAME_TYPE_SELECT_ONE: |
    ゲームを作成するには、少なくとも1つのゲームジャンルを選択する必要があります。
  TOOLTIP_RANDOM_SLIDER: |
    ゲーム制作中、開発・デザイン・仕上げの各段階のゲージの期待値がランダムになります。
  TOOLTIP_REQUIRE_GAME: |
    このアイテムのロックを解除するには、%sをお持ちであることが必要です。
  TOOLTIP_RELATIONSHIP: |
    良い関係であれば、より良いオファーを得ることができます。
    逆に、関係が悪いと交渉が厳しくなります。

    そのゲーム機でゲームを発売すると、関係が良くなります。また、
    独占契約を受けたり、ライセンスを購入したりしても関係が良くなります。

    独占契約を断ったり、ライセンスを買わずに交渉を始めたりすると、関係が悪くなります。
  TOOLTIP_EMPLOYEE_BETTER_STUDIO_FURNISHING: |
    自動販売機、植物、コーヒーメーカーを追加して、職場環境を改善しましょう。
  TOOLTIP_EMPLOYEE_BORED_GENRE: |
    従業員が新しいゲームジャンルに挑戦したがっています。この従業員は、次のようなゲームジャンルに取り組みたくありません：
  TOOLTIP_GAME_ENGINE_WHY: |
    ゲームエンジンを自作しましょう。

    独自のエンジンを作れば、ライセンスで販売することができます。
    あるいは、ロイヤリティ・フリーにして、コミュニティでゲーム・エンジンを改良してもらうこともできます。
    また、競合他社が有利にならないように、社内専用にする方法もあります。
  TOOLTIP_TRADE_PUBLISH_WHY: |
    競合他社のためにゲームを作りましょう。

    すぐに多くの新しいファンを獲得することができます。
    一方で、競合他社はさらに速く成長します。
  TOOLTIP_PUBLISH_GAME_WHY: |
    ゲームパブリッシャーになりましょう。

    これは自分でゲームを開発するよりも安上がりですが、多くの収益が得られます。
    ただし、ファンは獲得できません。
  TOOLTIP_REMAKE_MISSING_FEATURE_NO_ALTERNATIVE: |
    この機能はオリジナルのゲームにはありましたが、
    現在は使用できません。
  TOOLTIP_REMAKE_MISSING_FEATURE_ALTERNATIVE: |
    この機能は利用できませんが、
    代替機能がありますのでそちらを利用することをお勧めします。
  TOOLTIP_REMAKE_CAPACITIES_NOT_ENOUGH: |
    今回のリメイクでは、ゲーム機の性能を活かしきれていません。
  TOOLTIP_REMAKE_ENGINE_FEATURE_NOT_VALID: |
    対応していない機能もありますので、他の機能を選択してください。
  TOOLTIP_POSTMORTEM_ALREADY_DONE: |
    ゲームレポートはすでに作成済みです。
  TOOLTIP_POSTMORTEM_AUTOMATICALLY: |
    自動的にゲームレポートを作成します。
  TUTORIEL_CREATE_GAME: |
    このボタンをクリックすると、ゲーム作成パネルが表示されます。
  TUTORIEL_GAME_ENGINE_TOO_EXPENSIVE: |
    このゲームエンジンをアップグレードするためのコストは高くなります。
    実際、このゲームエンジンは老朽化しているので開発費が高騰する可能性があります。

    このようなペナルティを受けないためにも、このエンジンを更新せずに新しいエンジンを作るべきです。
    あるいは、レガシーコードを書き直すこともできます。新しいエンジンを作るより安上がりです。
  TUTORIEL_PLATFORM_MAKING_COSTS: |
    このゲーム機の製造コストは価格よりも高いです。
    売り上げが急増すれば、会社が倒産する可能性もあります。

    赤字にならないようにゲーム機の価格を上げる必要があります。
  TUTORIEL_CREATE_GAME_OBSOLETE: |
    他のパブリッシャーはこのゲーム機でゲームを販売することに失敗しています。
    あなたもこのゲーム機で十分な数のゲームを売ることができない可能性があります。

    他のゲーム機を選ばないと悲惨な結果になるかもしれません。
  TUTORIEL_CREATE_NORMAL_GAME: |
    このサイズのゲームが売れるほどのファンはいないので、
    90％以上の評価がないと成功しないでしょう。

    成功する為にはゲームのサイズを少し小さめにしたほうが良いでしょう。
    また、ファンを増やすために他社からのパブリッシングのオファーを受けるのもいいでしょう。
  LABEL_ORDER_BY_NAME_ONLY: 名前順のみ
  LABEL_ORDER_BY_NAME_AND_ACTIVITY: 名前とアクティビティ順

  # Tooltips
  TOOLTIP_SORT_STUDIO_LIST: |
    スタジオリストを並べ替える
  TOOLTIP_TIPS_CAPACITY: |
    契約やゲームレポートを作成することで、より多くのヒントを得られます。
    ヒントが増えるほど、青いゲージの精度が上がります。
  TOOLTIP_CANCEL_EXCLUSIVE_GAME: |
    あなたは独占契約にサインしました。
    このゲームは他のゲーム機に移植することはできず、少なくとも1年間は店頭に並べ続けなければなりません。
    この期間を過ぎると、契約を解除できます。
  TOOLTIP_KEEP_HINT: |
    このボックスをチェックすると、以前のセーブデータのゲームレポートで収集したすべての知識が保持されます。
  TOOLTIP_CONCURRENT_PAY_TO: >
    ゲーム「%s」が%sの期待に応えられなかったため、あなたは%sドルのペナルティを支払わなければなりません。手元に%sドルしかないため、破産を避けるにはローンを組んだほうがよいでしょう。
  TOOLTIP_ROYALTY_GET: |
    これは、発生した収益に対して受け取る割合です。
  TOOLTIP_ROYALTY_GIVE: |
    これは、発生した収益に対して支払う割合です。
  TOOLTIP_SERVER_BURNING: |
    サーバーがこれだけの人数を処理することはできませんので、ご注意ください。

    ゲームを購入したプレイヤーは売上としてカウントされますが、接続できないため、すぐに返金されます。
    これは大きな収入減になります。

    そろそろサーバーのキャパシティを増やすべきでしょう。
  TOOLTIP_FIRST_CUSTOM_CONSOLE: |
    おめでとうございます、あなたは最初のゲーム機に取り掛かり始めました。

    良いスタートを切るには、多くのゲームカタログが必要です。
    開発キットを送りつければ、競合他社があなたのゲーム機用のゲームを作るようになります。

    開発キットを送るには、そのボタンをクリックしてください。
  TOOLTIP_GAME_PRICE_TAG: |
    有料ゲームと無料ゲームを切り替えることができます。

    無料ゲームの場合、月額課金制のオンラインゲームを作るか、
    広告モジュールまたはマイクロトランザクションモジュールを有効にする必要があります。
  TOOLTIP_TRADE_DELAY_BETWEEN_ORDER_EXECUTION: |
    この時間帯に発行された売買注文をまとめて処理します。
  TOOLTIP_TRADE_CHART: |
    仕組みはシンプルです。それぞれのローソクは赤か青になり、株価が下がった場合は赤、
    同じローソクの最初と比べて株価が上がった場合は青になります。
    長方形はローソク足の本体で、始値から終値までの変動を表し、
    それを横切る細い線は最大値と最小値を示します。
  TOOLTIP_GAME_SIZE: |
    ゲームのサイズは、必要ポイント数、ゲーム開発時間、制作費に影響します。

    小さなゲームで90点以上のスコアを出すのは、大きなゲームよりも難しいです。
  TOOLTIP_THEME_TREND: |
    テーマのトレンドは売上に影響します。
  TOOLTIP_HAPPY_EMPLOYEE: |
    この従業員は幸せです。
  TOOLTIP_EMPLOYEE_HAPPINESS: |
    従業員の幸福度が高いほど休暇を取る頻度は少なくなり、
    幸福度が低いほど休暇を取る頻度は高くなります。
  TOOLTIP_EMPLOYEE_PRODUCTIVITY: |
    従業員の生産性が高ければ高いほど、より多くのポイントを生み出します。
  TOOLTIP_GAME_PRICE: |
    ゲームの価格が高ければ高いほど、利益は大きくなるでしょう。
    しかし、ゲームの価格を下げるとより多くのファンを獲得することができます。
  TOOLTIP_TOO_HARD: |
    この難易度は"ハード"です。
    難易度1または2をクリアしてから挑んだほうがよいでしょう。

    いきなり難易度の高いモードに挑戦すると、ゲームを楽しめなかったり不公平感やバランスの悪さを感じたりすることがあります。
  TOOLTIP_REQUIRED_POINTS: |
    良いゲームを作るために必要なポイント数。

    ゲームサイズが大きければ大きいほど、必要なポイントも大きくなります。
    また、過去4年間に作られた類似のゲームも参考にしています。
  TOOLTIP_NO_MONEY: |
    もっと合理的になるべきです。

    つまるところ、生き残り続けるためには経費を削減しなければなりません。
    今は会社を救済する必要があります。

    あなたの最善の策は、できるだけ高額で長期のローンを組むことです。
  TOOLTIP_GAME_UPDATE_BUTTON: >
    ゲームの更新、DLCの作成、財務状況の確認はこちらから
  TOOLTIP_GAMECREATION_HELP: >
    自分が作成した同一ジャンルのゲームを一覧表示します。ゲージの調整に便利です。
  TOOLTIP_GAMEENGINE_CREATE: >
    ゲームエンジンに搭載したい機能を選択します
  TOOLTIP_TIRED_GAME_GENRE: >
    従業員は新しいゲームジャンルに挑戦したがっており、同じゲームジャンルを作ることに飽きています：
  TOOLTIP_MARKETSEARCH_SELECT_PLATFORM_OR_THEME: |
    分析するテーマ／プラットフォームを選択してください
  TOOLTIP_MARKETSEARCH_SELECT_GENRE: |
    調査するゲームジャンルを選択してください
  TOOLTIP_MARKETSEARCH_SELECT_GENRE_OR_TARGETTED_AUDIENCE: |
    分析するゲームジャンル/ターゲット層を選択してください
  TOOLTIP_MARKETSEARCH_SELECT_PLATFORM: |
    調査するプラットフォームを選択してください
  TOOLTIP_MARKETSEARCH_MATCH_ALREADY_KNOWN: |
    その項目はすでに検討済みなので、改めて分析する必要はありません。
  TOOLTIP_UNIVERSITY_TRAINING_TYPE: |
    従業員が完璧になるまで、もしくは一定期間トレーニングを行います。
  TOOLTIP_UNIVERSITY_AUTOTRAINING: |
    従業員が完璧になるまで、または仕事があるまで、自動的にトレーニングを受けさせることができます。
    人事が必要です。
  TOOLTIP_UNIVERSITY_GLOBAL_TRAINING: |
    ビデオゲーム開発のあらゆる面で従業員をトレーニングします。
  TOOLTIP_UNIVERSITY_SPECIFIC_TRAINING: |
    ビデオゲーム開発の特定の分野で従業員をトレーニングします。
  TOOLTIP_PLATFORM_MARKETING: |
    有効にすると、ゲーム機の発売と同時に
    マーケティングキャンペーンを開始します。
  TOOLTIP_MENU_CREATE_GAME: |
    新規ゲームの作成、ゲームエンジンの作成、契約の作成、
    ゲームレポートの作成、ゲームの移植
  TOOLTIP_MENU_CREATE_CONSOLE: |
    デジタルストアの作成・管理や
    新しいコンソールの作成
  TOOLTIP_GAME_CREATION_BALANCING: |
    従業員に配分されている作業量を表示します。
    作業量が多すぎたり少なすぎたりすると、制作するゲームの品質に影響します。

    優秀なスコアを獲得するためには、作業量が白い領域内に収まっている必要があります。
  TOOLTIP_GAME_UPDATE: |
    無料のアップデートを公開すると、ゲームの売上が伸びます。
    有料DLCは、元のゲームの販売数に応じて収益を上げることができます。
  TOOLTIP_MATCH_EXCELLENT: 最高の相性
  TOOLTIP_MATCH_GOOD: 良い相性
  TOOLTIP_MATCH_OK: まずまずの相性
  TOOLTIP_MATCH_POOR: 悪い相性
  TOOTIP_STUDIO_HAPPINESS: |
    選ばれたスタジオが好きなゲームジャンル
  TOOLTIP_TOPSALES: |
    売れ筋ゲーム
  TOOLTIP_CONVENTION_LIST: |
    参加したコンベンション
  TOOLTIP_FORCE_STUDIO: |
    強制的に売却したいスタジオを選択する必要があります。
  TOOLTIP_CRACK_GAME: |
    クラックしたいゲームを選択する必要があります。
  TOOLTIP_HIRE_STAFF: |
    採用したい従業員を選択する必要があります。
  TOOLTIP_CONCURRENT_LOCKED: |
    %sに対しては、%sから再びアクションを起こせます。
  TOOLTIP_TUTORIEL: |
    %sで%sをアンロック
  TOOLTIP_EMAIL: |
    ニュースやメールを読む。
  TOOLTIP_UNLOCK_GAME_GENRE: |
    新しいタイプのゲームをアンロックすることができます。
  TOOLTIP_MANAGE_STUDIO: |
    スタジオの管理、コンピューターのアップグレード、従業員の配置...。
  TOOLTIP_GAMEPORT: ビデオゲームを他のプラットフォームに移植する。
  TOOLTIP_POSTMORTEM: |
    ポストモーテムレポートを作成する。
    ポストモーテムがあれば
    より良いゲームを作ることができます。
  TOOLTIP_CREATE_GAME: 新たなゲームを作成
  TOOLTIP_STAFF: 従業員リスト
  TOOLTIP_RECRUIT: 町にいる採用候補者を一覧表示します。
  TOOLTIP_PORTFOLIO: これまでに作ったゲームをすべてリストアップします。
  TOOLTIP_OPTION: パラメータとオプション
  TOOLTIP_EXIT: デスクトップに戻る
  TOOLTIP_STUDIOS: スタジオ一覧
  TOOLTIP_STUDIOLIST: 街で借りられるオフィスの一覧
  TOOLTIP_CONSTRUCT: |
    オフィス用、または
    コンベンション開催用の
    新しい建物を建てます。
  TOOLTIP_CONFERENCE: コンベンションの管理
  TOOLTIP_MARKETING: マーケティングキャンペーンの管理
  TOOLTIP_SELL: オフィスを売る
  TOOLTIP_SHOP: オフィス用の家具やグッズの購入
  TOOLTIP_BUILDMOD: オフィスの塗装と美化
  TOOLTIP_ASSIGN: 従業員の配置
  TOOLTIP_STUDIO_SELECT: スタジオの選択
  TOOLTIP_ANNOUNCE_GAME: |
    ビデオゲームを発表する。
    期待度を高めます。
  TOOLTIP_CONCURRENT: |
    ビデオゲーム会社の一覧
  TOOLTIP_STUDIO_COST: |
    スタジオの総費用。 家賃や機材の維持費(サーバーなど)も含む
  TOOLTIP_MARKETING_COST: |
    現在実施中のマーケティング・キャンペーンの費用
  TOOLTIP_SALARY_COST: |
    各従業員の給与
  TOOLTIP_STEAM_MODS: |
    Steam ワークショップ
  TOOLTIP_HUMANRESOURCE: |
    人事担当者を配置し、
    従業員のスケジュールや昇給を管理する
  TOOLTIP_GAME_OF_THE_YEAR: |
    毎年、新しいゲームが「ゲーム・オブ・ザ・イヤー」に選ばれます。
  TOOLTIP_DESK_REPLACE: |
    机の入れ替え、パソコンの更新
  TOOLTIP_POSTMORTEM_RED_ZONE: |
    ゲームレポートのおかげでブルーゾーンが絞り込まれました。
    ブルーゾーンを出てしまうとバランスの悪いゲームを作ってしまい、
    悪い評価を受けてしまうリスクがあります。

  # Showd when game is loading
  LOADING_SCREEN_TIP_0: >
    あなたの会社は、過去4年間に制作したゲームのクオリティーに基づいて密かに評価されています。
  LOADING_SCREEN_TIP_1: >
    パーフェクトな従業員が自発的に応募し、生産チームを強化することができます。
  LOADING_SCREEN_TIP_2: >
    実はこのローディング画面は "sleep(random(0, 50))" でループを作りただ待たせているだけなんです……。
  LOADING_SCREEN_TIP_3: >
    新しいゲームジャンルを発見することは、競合他社に対して大きなアドバンテージとなります。
  LOADING_SCREEN_TIP_4: >
    競合他社と一緒にゲームを作ることが、有名になる一番の近道です。
  LOADING_SCREEN_TIP_5: >
    自社ビルでコンベンションを開催することは可能ですが、年に1回程度にしておきましょう。
  LOADING_SCREEN_TIP_6: >
    販売不振部門はいつも正しい。
  LOADING_SCREEN_TIP_7: >
    オンラインゲームをホストするためにはサーバーが必要です。オンラインゲームは安価ですが、プレイヤーは継続してプレイするためには毎月お金を払わなければなりません。
  LOADING_SCREEN_TIP_8: >
    マスコットキャラクターの Einstein は、City Game Studioの開発中に65.13回吠えました。
  LOADING_SCREEN_TIP_9: >
    City Game Studioの開発では、クリスマスキャロルが12,654回聴かれました。
  LOADING_SCREEN_TIP_10: >
    マーケットシェアを見るのもいいですが、そのプラットフォームで発売されたゲームの数にも注意する必要があります。
  LOADING_SCREEN_TIP_11: >
    City Game Studioの翻訳に協力してみませんか？Discordに参加しましょう: https://discord.gg/citygamestudio
  LOADING_SCREEN_TIP_12: >
    サーバーのランプが赤くなっていたら、負荷がかかっているということです。
  LOADING_SCREEN_TIP_13: >
    コーヒーブレイクも忘れずに……あっ、またコーヒーメーカーが壊れた。
  LOADING_SCREEN_TIP_14: >
    "クランチタイム" は、シリアルのブランドではなく一般的なマネジメント手法です。
  LOADING_SCREEN_TIP_15: >
    新しいゲームをリリースすることは、お金を稼ぐための最良の方法です。
  LOADING_SCREEN_TIP_16: >
    ポストモーテムでは、公開したゲームの詳細を知ることができます。
  LOADING_SCREEN_TIP_17: >
    最近の調査によると、雨が降ると約625.3匹の犬のうち1匹が吠え、他の犬はそれを馬鹿にしています。
  LOADING_SCREEN_TIP_18: >
    ロード画面に書かれていることを鵜呑みにしてはいけません。
  LOADING_SCREEN_TIP_19: >
    猫を飼うと、スタジオにちょっとしたボーナスがもたらされます。
  LOADING_SCREEN_TIP_20: >
    スタジオのスキルレベルにばらつきがあると、ゲーム全体のクオリティに悪影響を及ぼします。
  LOADING_SCREEN_TIP_21: >
    F1を押すと、ゲーム内コンソールが開きます。

