  TOOLTIP_BACKWARD_COMPATIBILITY: |
    Для того чтобы создать консоль с обратной совместимостью, необходимо, чтобы вы уже создали консоль того же типа.
    То есть, если вы создаете портативную консоль и хотите сделать ее обратно совместимой,
    то вам нужна портативная консоль, которую вы уже делали раньше.
    Она будет обратно совместима с последней консолью того же типа, которую вы создали.

    Обратная совместимость позволяет быстрее и лучше переносить игры с предшествующей консоли.
    С другой стороны, на текущую консоль потребуется много очков разработки.

    Невозможно сделать консоль обратно совместимой, если до этого вы не выпустили консоль того же типа.
  LABEL_EVENT_GAME_NEEDS_UPDATE_ASK_TITLE: Пожалуйста, обновите!
  LABEL_EVENT_GAME_NEEDS_UPDATE_ASK_DESCRIPTION: |
    Привет, [b]%s[/b],

    У нас есть небольшое сообщество, созданное вокруг [b]%s[/b].
    Они делятся советами и следят за новостями вашей компании, с нетерпением ожидая новостей от [b]%s[/b].

    Если вы опубликуете обновление в ближайшие [b]%d месяцев[/b], они будут рады!
  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_TITLE: Отличное обновление!
  LABEL_EVENT_GAME_NEEDS_UPDATE_DONE_DESCRIPTION: |
    Похвально, что вы оправдали ожидания своих поклонников.

    Ваши поклонники в восторге от этого обновления!
    Они рассказывают о нём всем вокруг, усиливая энтузиазм вокруг [b]%s[/b], что скажется на продажах.

    Отличная работа, вы можете гордиться собой.
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_TITLE: Слишком поздно...
  LABEL_EVENT_GAME_NEEDS_UPDATE_CANCEL_DESCRIPTION: |
    Игра [b]%s[/b] была выпущена несколько месяцев назад.
    Ажиотаж вокруг игры спал, за это время были выпущены другие похожие игры.

    Вы упустили эту возможность, не упустите следующую.
  LABEL_EVENT_GAME_SEQUEL_ASK_TITLE: Когда будет продолжение?
  LABEL_EVENT_GAME_SEQUEL_ASK_DESCRIPTION: |
    Мистер [b]%s[/b],

    Мы с друзьями очень любим играть в [b]%s[/b]!
    Мы играем в нее уже более [b]%s[/b] лет, и мы хотели бы, чтобы вы, ребята, сделали продолжение!

    Мы очень любим эту игру и собираемся играть в нее еще долгие годы!
    Но если вы сделаете продолжение сейчас, мы купим его и расскажем о нем нашим друзьям!
        
    Поэтому, пожалуйста, сделайте продолжение!
    Вы такие талантливые, вы нас точно не разочаруете!

    Игрок в подвале
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_TITLE: Продолжение?!
  LABEL_EVENT_GAME_SEQUEL_GET_SAD_DESCRIPTION: |
    Я разочарован, в буквальном смысле. Мы со всеми друзьями сыграли в [b]%s[/b], и это совсем не похоже на оригинал!

    Ну, мы все равно купили ее, и мы все равно закончили ее, но мы бы хотели более качественную игру.

    Игрок в подвале
  LABEL_EVENT_GAME_SEQUEL_GET_OK_TITLE: "%s - это здорово!"
  LABEL_EVENT_GAME_SEQUEL_GET_OK_DESCRIPTION: |
    Именно то, чего мы всегда хотели! Это фантастическое продолжение!
    Мы обсуждали его с моими друзьями, и я чувствую, что мы будем много в него играть.

    [b]%s[/b] оправдывает наши ожидания, и, честно говоря, большое вам спасибо!

    Игрок в подвале
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_TITLE: НЕВЕРОЯТНО!!
  LABEL_EVENT_GAME_SEQUEL_GET_HAPPY_DESCRIPTION: |
    [b]%s[/b] захватывает дух!

    Графика, геймплей, музыка, всё настолько идеально.
    Вы стали мастерами в искусстве создания игр!

    Все так счастливы от этого продолжения, на самом деле я купил его 10 раз, чтобы подарить всем своим близким друзьям и родственникам!

    Вы лучшие!
    Спасибо вам огромное!

    Игрок в подвале
  LABEL_EVENT_GAME_THEME_TRENDING_TITLE: "%s в моде"
  LABEL_EVENT_GAME_THEME_TRENDING_DESCRIPTION: |
    Здравствуйте, [b]%s[/b],

    Выпуск [b]%s[/b] - это настоящий прорыв в современных тенденциях.
    Они хотят больше, больше и больше. Они отчаянно хотят игр на тему «[b]%s[/b]».

    Это новая тенденция, и она не продлится долго, вам лучше поскорее использовать ее в своих интересах.
